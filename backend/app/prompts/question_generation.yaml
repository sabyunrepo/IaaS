  revise_questions:
    description: "품질 검토 후 질문 수정 - 환각 제거"
    template: |
      # CRITICAL OUTPUT RULES (READ FIRST)
      - Return ONLY raw JSON, NO markdown formatting
      - Do NOT wrap output in ```json or ``` code blocks
      - Start your response with [ and end with ]
      - No explanatory text before or after the JSON array

      # ROLE & GOAL
      Revise interview questions based on quality review feedback, especially to remove hallucinations.

      # WHAT YOU WILL SEE
      - Original questions with issues flagged
      - Review feedback identifying problems
      - Evidence scores and hallucination risks

      # QUESTIONS TO REVISE
      Language: {{output_language}}
      {{questions_json}}

      # REVIEW FEEDBACK
      {{review_feedback}}

      # REVISION RULES
      1. **Hallucination detected**: Replace with question based on documented evidence only
      2. **Low evidence score**: Make question more open-ended to let candidate demonstrate
      3. **Duplicate detected**: Merge or differentiate questions
      4. **Clarity issue**: Rephrase for better understanding
      5. **Bias detected**: Remove biased language

      # OUTPUT FORMAT (JSON)
      Return revised questions as array:
      ```json
      [
        {
          "original_index": 0,
          "revision_type": "hallucination_fix|evidence_improvement|clarity_fix|bias_removal|duplicate_merge",
          "original_question": "Original question text",
          "revised_question": "Revised question text",
          "revision_rationale": "Why this change was made",
          "new_evidence_reference": "Updated evidence this is based on",
          "new_confidence_score": 0.0-1.0
        }
      ]
      ```

      # EXAMPLE REVISION
      Original (hallucinated):
      ```json
      {"question_text": "Kubernetes에서 HPA 설정 경험을 말씀해주세요"}
      ```
      Review feedback: "HALLUCINATION: No Kubernetes evidence. Only Docker mentioned."

      Revised:
      ```json
      {
        "original_index": 3,
        "revision_type": "hallucination_fix",
        "original_question": "Kubernetes에서 HPA 설정 경험을 말씀해주세요",
        "revised_question": "Docker 컨테이너를 사용하면서 스케일링이 필요한 상황을 경험하셨나요? 어떻게 처리하셨는지 설명해주세요",
        "revision_rationale": "Changed from assumed Kubernetes to documented Docker experience",
        "new_evidence_reference": "Resume: 'Docker 기반 배포 경험'",
        "new_confidence_score": 0.85
      }
      ```

