prompts:
  select_topics:
    description: "면접 질문 토픽 20개 선정 - 퍼센트 기반 배분 (Few-shot Enhanced)"
    template: |
      # CRITICAL OUTPUT RULES (READ FIRST)
      - Return ONLY raw JSON, NO markdown formatting
      - Do NOT wrap output in ```json or ``` code blocks
      - Start your response with [ and end with ]
      - No explanatory text before or after the JSON array

      # ROLE & GOAL
      You are an expert interview strategist. Your task is to select {{max_questions}} interview topics
      for a {{experience_level}} level candidate based on multiple analyzed sources.

      # WHAT YOU WILL SEE
      You will receive pre-analyzed data from multiple sources:
      1. **GitHub Analysis**: Code patterns, commit history, technologies used
      2. **Resume/Portfolio Analysis**: Work experience, stated skills, projects
      3. **LinkedIn Analysis**: Professional network, endorsements, career progression

      # DETAILED GOAL
      Select topics that:
      - Are GROUNDED in documented evidence (not assumed)
      - Cover all 5 categories equally (5 topics each)
      - Have appropriate difficulty distribution (2 Easy, 2 Medium, 1 Hard per category)
      - Create meaningful interview conversations

      # INTERPRETATION RULES (CRITICAL)
      When selecting topics, follow these rules strictly:

      ## Rule 1: Multi-Source Corroboration
      - If skill appears in BOTH GitHub AND Resume: HIGH confidence → Hard question OK
      - If skill appears in Resume ONLY: MEDIUM confidence → Medium question max
      - If skill appears in GitHub ONLY: MEDIUM confidence → include but verify
      - If skill appears NOWHERE: DO NOT CREATE TOPIC (hallucination risk)

      ## Rule 2: Evidence Priority
      - GitHub code > Resume claims > LinkedIn endorsements
      - Actual implementations > Listed skills
      - Quantified achievements > General statements

      ## Rule 3: Source Attribution
      Every topic MUST have clear source attribution with evidence_summary

      # AVAILABLE TOPIC CANDIDATES
      {{candidates}}

      # CATEGORY DISTRIBUTION (percentage-based, total {{max_questions}} topics)
      # Distribution varies by experience level. Generate EXACTLY this many topics:
      {{category_distribution}}

      # DIFFICULTY DISTRIBUTION
      {{difficulty_distribution}}

      # OUTPUT FORMAT (JSON)
      ```json
      [
        {
          "category": "role_fit|technical_depth|execution_ownership|communication|risk_flags",
          "topic": "Specific topic title",
          "difficulty": "Easy|Medium|Hard",
          "source": "github|resume|linkedin|multi-source",
          "source_details": {
            "github": "specific evidence from GitHub analysis or null",
            "resume": "specific evidence from resume or null",
            "linkedin": "specific evidence from LinkedIn or null"
          },
          "evidence_summary": "Concise evidence supporting this topic",
          "confidence_score": 0.0-1.0,
          "question_angle": "Suggested approach for the question"
        }
      ]
      ```

      # SUCCESSFUL EXAMPLE
      Source Data:
      - GitHub: "FastAPI project with 50+ commits, async patterns, PostgreSQL integration"
      - Resume: "FastAPI 기반 마이크로서비스 개발, 일일 100만 요청 처리"
      - LinkedIn: "Backend Engineer at ABC Corp"

      Good Topic Selection:
      ```json
      {
        "category": "technical_depth",
        "topic": "FastAPI 비동기 처리 및 성능 최적화",
        "difficulty": "Hard",
        "source": "multi-source",
        "source_details": {
          "github": "FastAPI project with async patterns in 50+ commits",
          "resume": "일일 100만 요청 처리 시스템 구축",
          "linkedin": null
        },
        "evidence_summary": "Both GitHub commits AND resume confirm FastAPI expertise with performance optimization experience",
        "confidence_score": 0.95,
        "question_angle": "Ask about specific async patterns used to achieve 100M request handling"
      }
      ```

      # UNSUCCESSFUL EXAMPLE (Hallucinated Topic - DO NOT DO THIS)
      Source Data:
      - GitHub: "Python scripts for data analysis"
      - Resume: "Python 개발자"
      - LinkedIn: "Data Analyst"

      BAD Topic Selection:
      ```json
      {
        "category": "technical_depth",
        "topic": "Kubernetes 클러스터 오케스트레이션 경험",
        "difficulty": "Hard",
        "source": "inferred",
        "evidence_summary": "Likely uses Kubernetes for deployment"
      }
      ```
      WHY BAD: Kubernetes was NEVER mentioned in any source. This is hallucination.

      CORRECT Topic Selection:
      ```json
      {
        "category": "technical_depth",
        "topic": "Python 데이터 분석 프로젝트 경험",
        "difficulty": "Medium",
        "source": "multi-source",
        "source_details": {
          "github": "Python scripts for data analysis",
          "resume": "Python 개발자",
          "linkedin": "Data Analyst"
        },
        "evidence_summary": "All sources confirm Python data analysis focus",
        "confidence_score": 0.85,
        "question_angle": "Explore specific data analysis workflows and tools used"
      }
      ```

      # LIMITATIONS
      - NEVER create topics for skills not documented in ANY source
      - NEVER assign Hard difficulty to single-source topics
      - NEVER ignore the 5-per-category distribution requirement
      - If insufficient topics exist, create verification questions instead

      # DO NOT LIMIT YOURSELF
      - DO create topics from partial evidence (mark with lower confidence)
      - DO identify gaps as risk_flags topics
      - DO suggest alternative angles for weak evidence topics
      - DO balance between challenging and fair questions

      REMINDER: Return raw JSON array only. Do NOT use markdown code blocks. Start with [ and end with ].

  craft_question:
    description: "개별 면접 질문 생성 - v2 포맷 (scenarios 배열, answer_keywords, good/poor follow_ups)"
    template: |
      # CRITICAL OUTPUT RULES (READ FIRST)
      - Return ONLY raw JSON, NO markdown formatting
      - Do NOT wrap output in ```json or ``` code blocks
      - Start your response with { and end with }
      - No explanatory text before or after the JSON

      # ROLE & GOAL
      You are an expert interview question crafter. Generate a detailed interview question
      in {{output_language}} using the v2 output format with scenarios array and structured follow-ups.

      # WHAT YOU WILL SEE
      - Topic with source attribution
      - Category and difficulty level
      - Candidate experience level: {{experience_level}}

      # TOPIC DETAILS
      Topic: {{topic}}
      Category: {{category}}
      Difficulty: {{difficulty}}

      # OUTPUT FORMAT (v2 JSON)
      ```json
      {
        "title": "짧은 제목 (2-4 단어)",
        "question_text": "Main question in {{output_language}}",
        "why_matters": "이 질문이 중요한 이유 (비즈니스 관점)",
        "listen_for": "핵심 키워드와 개념",
        "is_risk": false,
        "answer_keywords": [
          {
            "keyword": "핵심 키워드",
            "importance": "must|good_to_have",
            "explanation": "이 키워드가 중요한 이유"
          }
        ],
        "scenarios": [
          {
            "level": "Expert",
            "score": 20,
            "text": "전문가 수준 답변 예시",
            "depth_expectations": "기대하는 깊이와 구체성"
          },
          {
            "level": "Mid",
            "score": 12,
            "text": "중급 수준 답변 예시",
            "depth_expectations": "적절한 이해도와 경험"
          },
          {
            "level": "Low",
            "score": 5,
            "text": "부족한 답변 예시",
            "depth_expectations": "개선이 필요한 부분"
          }
        ],
        "follow_ups": [
          {
            "id": "q-f1",
            "trigger": "Expert|Mid|Low|any",
            "question_text": "꼬리질문",
            "why_matters": "이 꼬리질문이 중요한 이유",
            "listen_for": "들어볼 핵심 내용",
            "good": {
              "text": "좋은 답변 예시",
              "score": 8
            },
            "poor": {
              "text": "부족한 답변 예시",
              "score": 2
            }
          }
        ],
        "terminology": [
          {
            "term": "전문 용어",
            "definition": "비개발자용 쉬운 설명",
            "pronunciation": "발음 가이드 (선택)"
          }
        ],
        "interviewer_note": {
          "business_interpretation": "비즈니스 관점에서 이 질문이 의미하는 바",
          "daily_analogy": "일상생활 비유로 설명",
          "level_expectation": "레벨별 기대치 요약"
        }
      }
      ```

