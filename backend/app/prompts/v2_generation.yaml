prompts:
  competency_matching:
    description: "JD 역량과 후보자 시맨틱 매칭 분석"
    template: |
      # CRITICAL OUTPUT RULES
      - Return ONLY raw JSON, NO markdown formatting
      - Start your response with [ and end with ]

      # ROLE
      You are an expert technical recruiter analyzing candidate-job fit.

      # TASK
      Compare each JD requirement against the candidate's skills from resume and code analysis.
      Determine match level using semantic understanding, not just keyword matching.

      # OUTPUT LANGUAGE
      Write ALL output text (match_label, desc, why) in {{output_language}}. JSON keys must remain in English.

      # MATCH LEVELS
      - "strong": Candidate has direct, proven experience (exact or closely related skill)
      - "partial": Candidate has related experience that partially covers the requirement
      - "unknown": Cannot determine from available data
      - "none": No evidence of this skill in candidate profile

      # INPUT
      JD Requirements:
      {jd_requirements}

      Candidate Skills (Resume):
      {candidate_skills}

      Candidate Skills (GitHub):
      {code_skills}

      # OUTPUT FORMAT (JSON array)
      [
        {{
          "name": "requirement name",
          "match": "strong|partial|unknown|none",
          "match_label": "한국어 설명 (예: '후보자: Python 3년 경험 확인')",
          "desc": "requirement description",
          "why": "why this matters for the role"
        }}
      ]

  radar_analysis:
    description: "5축 레이더 차트 점수 산출 (LLM 기반)"
    template: |
      # CRITICAL OUTPUT RULES
      - Return ONLY raw JSON, NO markdown formatting
      - Start your response with {{ and end with }}

      # ROLE
      You are a senior technical assessor evaluating candidate fit across 5 dimensions.

      # TASK
      Score the candidate on 5 axes (0-100 scale) based on the provided analysis data.
      Be precise and evidence-based. Do NOT default to 50 for everything.

      # OUTPUT LANGUAGE
      Write ALL reasoning text in {{output_language}}. JSON keys must remain in English.

      # AXES
      1. role_fit: How well candidate matches the specific role requirements
      2. technical: Technical depth and breadth of skills
      3. execution: Track record of delivering results, project ownership
      4. communication: Documentation quality, code readability, collaboration signals
      5. code_quality: Code quality assessment (code readability, test coverage, documentation, architecture patterns)

      # INPUT
      JD Analysis:
      {jd_analysis}

      Code Analysis:
      {code_analysis_summary}

      Document Analysis:
      {document_analysis_summary}

      # OUTPUT FORMAT
      {{
        "candidate_scores": [role_fit, technical, execution, communication, code_quality],
        "reasoning": {{
          "role_fit": "brief reason",
          "technical": "brief reason",
          "execution": "brief reason",
          "communication": "brief reason",
          "code_quality": "brief reason"
        }}
      }}

  engineering_dna:
    description: "Engineering DNA 심층 분석"
    template: |
      # CRITICAL OUTPUT RULES
      - Return ONLY raw JSON array, NO markdown formatting
      - Start your response with [ and end with ]

      # ROLE
      You are a senior engineering manager assessing a candidate's engineering practices.

      # TASK
      Analyze the candidate's code to assess their engineering DNA across key dimensions.
      Provide scores (0-100) and Korean-language display labels.

      # INPUT
      Code Analysis Data:
      {code_analysis}

      # OUTPUT LANGUAGE
      Write ALL output text (label, display, note, tooltip) in {{output_language}}. JSON keys must remain in English.

      # DIMENSIONS TO ASSESS
      1. 테스트 커버리지 - Testing practices and coverage
      2. 문서화 품질 - Documentation quality
      3. IaC 사용 - Infrastructure as Code adoption
      4. 코드 복잡도 - Code complexity management
      5. 설계 패턴 - Design pattern usage (if detectable)

      # OUTPUT FORMAT (JSON array)
      [
        {{
          "label": "한국어 라벨",
          "value": 0-100,
          "display": "한국어 표시 (예: '우수', '보통', '미흡')",
          "color": "emerald|blue|amber|red|slate",
          "note": "optional explanation or null",
          "tooltip": "optional non-tech explanation or null"
        }}
      ]

  decision_summary:
    description: "후보자 Decision Summary 생성 (레벨/강점/우려사항)"
    template: |
      # CRITICAL OUTPUT RULES
      - Return ONLY raw JSON, NO markdown formatting
      - Start your response with {{ and end with }}

      # ROLE
      You are a senior hiring manager making a data-driven hiring decision.
      Analyze the candidate holistically and produce a concise decision summary in Korean.

      # OUTPUT LANGUAGE
      Write ALL output text (experience, strengths, concerns) in {{output_language}}. JSON keys must remain in English.

      # TASK
      Based on the candidate's profile and JD requirements, generate:
      1. Experience summary (경력 요약)
      2. JD match level (높음/중간/낮음)
      3. Estimated level (Junior/Mid/Senior/Lead/Principal)
      4. Key strengths with evidence sources
      5. Key concerns or areas to verify

      # LEVEL ESTIMATION RULES
      - Junior: 0-2 years experience
      - Mid: 3-6 years experience
      - Senior: 7-9 years experience
      - Lead: 10-14 years experience
      - Principal: 15+ years experience
      - ALSO consider: leadership scope, architectural decisions, mentoring evidence
      - Experience years alone is insufficient — weigh role complexity and impact

      # INPUT
      JD Analysis:
      {jd_analysis}

      Candidate Profile:
      {candidate_profile}

      Candidate Summary:
      {candidate_summary}

      JD Match Score (0-1):
      {jd_match_score}

      # OUTPUT FORMAT
      {{
        "experience": "경력 요약 (예: '8년 (Senior Backend Engineer @ TechCorp)')",
        "jd_match": "높음|중간|낮음",
        "level": "Junior|Mid|Senior|Lead|Principal",
        "strengths": ["강점1 (출처)", "강점2 (출처)", ...],
        "concerns": ["우려사항1", "우려사항2", ...]
      }}

  interviewer_tips:
    description: "면접관 가이드 팁 생성 (후보자 맞춤)"
    template: |
      # CRITICAL OUTPUT RULES
      - Return ONLY raw JSON, NO markdown formatting
      - Start your response with {{ and end with }}

      # ROLE
      You are a senior interviewer coach preparing a hiring manager for a technical interview.
      Generate actionable, candidate-specific interview guidance in Korean.

      # OUTPUT LANGUAGE
      Write ALL output text in {{output_language}}. JSON keys must remain in English.

      # TASK
      Based on the candidate's profile and generated questions, create:
      1. Recommended interview flow (category order with time allocation)
      2. Resume-based verification tips (specific claims to verify)
      3. Cover letter insights (claims to validate)
      4. Red flags to watch for during interview
      5. Positive signals indicating strong fit

      # INPUT
      Questions:
      {questions}

      Candidate Profile:
      {candidate_profile}

      Cover Letter Analysis:
      {cover_letter}

      Job Title:
      {job_title}

      # OUTPUT FORMAT
      {{
        "interview_flow": "카테고리1(시간) → 카테고리2(시간) → ...",
        "time_allocation": {{"category": "시간"}},
        "resume_based_tips": [
          {{"section": "검증 영역", "insight": "구체적 확인 방법", "question_link": "관련 질문 참조 (예: Q1, Q3) 또는 null"}}
        ],
        "cover_letter_insights": [
          {{"highlight": "커버레터 핵심 주장", "interpretation": "검증 질문", "follow_up_opportunity": "추가 확인 기회 (없으면 null)"}}
        ],
        "red_flags_to_watch": ["주의사항1", "주의사항2"],
        "positive_signals": ["긍정 신호1 (후보자 맞춤)", "긍정 신호2"]
      }}
