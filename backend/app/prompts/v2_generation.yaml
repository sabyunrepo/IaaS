prompts:
  radar_analysis:
    description: "5축 레이더 차트 점수 산출 (LLM 기반, 공식 기준 참조)"
    template: |
      # CRITICAL OUTPUT RULES
      - Return ONLY raw JSON, NO markdown formatting
      - Start your response with {{ and end with }}

      # ROLE
      You are a senior technical assessor evaluating candidate fit across 5 dimensions.

      # TASK
      Score the candidate on 5 axes (0-100 scale) based on the provided analysis data.
      A deterministic formula has pre-computed base scores (see FORMULA BASE below).
      Your job: refine these scores using qualitative evidence the formula cannot capture.
      Your final scores MUST stay within ±15 points of the formula base.
      Each score MUST cite at least one specific evidence point in the reasoning.

      # OUTPUT LANGUAGE
      Write ALL reasoning text in {{output_language}}. JSON keys must remain in English.

      # SCORING CALIBRATION (what different ranges mean)
      - 85-100: Exceptional — exceeds role requirements with strong evidence
      - 70-84: Strong — meets requirements well, multiple evidence points
      - 50-69: Adequate — meets some requirements, limited evidence
      - 30-49: Below expectations — significant gaps, weak evidence
      - 0-29: Critical gaps — little to no relevant evidence

      # AXES AND SCORING CRITERIA
      1. role_fit: JD requirement coverage + skill overlap ratio
         - High: ≥80% of JD requirements matched by candidate skills
         - Low: <40% overlap or key requirements missing
      2. technical: Code quality metrics + tech stack breadth + contribution consistency
         - High: Good code quality + diverse tech + active monthly commits
         - Low: No code data or poor quality metrics
      3. execution: Experience years (SFIA) + commit consistency + code contribution volume
         - High: Senior+ experience + consistent monthly commits + substantial codebase
         - Low: Junior experience + sporadic activity
      4. communication: Documentation score + code readability (inverse complexity)
         - High: Well-documented code + low cyclomatic complexity
         - Low: No documentation + high complexity
      5. code_quality: Composite of complexity(30%) + test coverage(30%) + docs(20%) + stability(20%)
         - High: Low complexity + good test coverage + well-documented + stable codebase
         - Low: High complexity + no tests + no docs

      # FORMULA BASE SCORES (deterministic reference — your scores must be within ±15 of these)
      {{formula_base_scores}}

      # FORMULA CALCULATION SOURCES
      {{formula_sources}}

      # INPUT
      JD Analysis:
      {{jd_analysis}}

      Code Analysis:
      {{code_analysis_summary}}
      NOTE: Code analysis may include extended fields from AST/JD-Aware pipeline:
      - jd_relevance_scores: per-file JD keyword match and interview potential scores
      - ast_chunk_count: number of AST-extracted code chunks analyzed
      - analyzed_functions_count: total functions/classes analyzed
      - hybrid_metadata: pipeline metadata (clone-based vs diff-based)
      If these fields are present, use them to strengthen scoring evidence.
      If absent, rely on existing tech_stack/quality_metrics as before.

      Document Analysis:
      {{document_analysis_summary}}

      LinkedIn Profile Data:
      {{linkedin_context}}
      NOTE: LinkedIn provides verified employment history and skill endorsements.
      If present, use for experience validation and skill cross-referencing.
      If empty, do not penalize — not all candidates have LinkedIn profiles.

      Unified Candidate Skills (multi-source):
      {{unified_skills_context}}
      NOTE: Skills merged from Resume, GitHub, LinkedIn, and Cover Letter with source tracking.
      If present, use as primary skill evidence. Each entry includes which sources confirmed the skill.
      If empty, rely on Document Analysis skills above.

      # ADDITIONAL CONTEXT (may be empty)
      {{kg_context}}

      # REASONING REQUIREMENTS
      Each axis reasoning MUST include at least ONE specific numeric data point from the input.
      FORBIDDEN: "후보자는 기술력이 높음", "전반적으로 우수함", "경험이 풍부함" (too vague)
      REQUIRED: "test_coverage 72%, documentation_score 65% (GitHub)" (specific metrics with source)
      When LinkedIn data is available, cite it: "경력 5년, Senior Engineer @ TechCorp (LinkedIn)"
      When unified skills are available, cite source count: "Python — Resume + GitHub + LinkedIn 3개 소스 확인"

      # FORBIDDEN PATTERNS (will cause rejection)
      - Reasoning without numeric data: "기술력이 우수함" ← REJECTED (no metric)
      - Reasoning without source tag: "코드 품질이 높음" ← REJECTED (no (GitHub)/(Resume))
      - Score outside ±15 of formula base: formula=60 but score=80 ← REJECTED
      - EVERY reasoning MUST contain at least one number AND one source tag in parentheses

      # OUTPUT FORMAT
      {{
        "candidate_scores": [role_fit, technical, execution, communication, code_quality],
        "reasoning": {{
          "role_fit": "MUST cite skill count or match ratio (e.g., 'JD 5개 요구사항 중 4개 매칭: Python, FastAPI, Docker, PostgreSQL (Resume + GitHub)')",
          "technical": "MUST cite tech stack count or commit data (e.g., 'tech stack 8종, 활성 월 10/12개월 (GitHub)')",
          "execution": "MUST cite years or commit volume (e.g., '경력 5년 (Resume), 커밋 200+ (GitHub)')",
          "communication": "MUST cite doc/complexity metric (e.g., 'documentation_score 65%, 평균 CC 8.2 (GitHub)')",
          "code_quality": "MUST cite test/complexity metric (e.g., 'test_coverage 45%, complexity_score 62 (GitHub)')"
        }}
      }}

  skill_matching:
    description: "JD 요구사항 vs 후보자 스킬 시맨틱 매칭 (근거 기반)"
    template: |
      # CRITICAL OUTPUT RULES
      - Return ONLY raw JSON array, NO markdown formatting
      - Start your response with [ and end with ]

      # ROLE
      You are an expert technical recruiter performing evidence-based semantic skill matching.

      # TASK
      Match each JD requirement against the candidate's actual skills from resume and code analysis.
      Use semantic understanding: "Boto3" relates to "cloud infrastructure", "OpenAI SDK" relates to "LLM API development", etc.
      Be honest: if a skill genuinely doesn't match, mark it as "none".
      EVERY match MUST cite the specific evidence source.

      # OUTPUT LANGUAGE (CRITICAL)
      Write ALL output text in {{output_language}}.
      The fields "skill", "candidate", and "evidence" MUST be written in {{output_language}}.
      JSON keys must remain in English.

      # MATCH TYPES
      - "exact": Direct match (e.g., "Python" ↔ "Python")
      - "similar": Closely related skill (e.g., "API development" ↔ "FastAPI experience")
      - "partial": Tangentially related (e.g., "Cloud services" ↔ "AWS S3 usage")
      - "none": No meaningful connection

      # CONFIDENCE CALIBRATION
      - 90-100: Exact skill name match confirmed in both Resume AND GitHub
      - 70-89: Exact match in one source, or strong semantic match in both
      - 50-69: Semantic/partial match in one source only
      - 30-49: Weak or tangential connection
      - 0-29: No evidence found (type should be "none")

      # EVIDENCE RULES
      - For "evidence" field, use STRICT format: "Resume: [skill name] listed" or "GitHub: [skill name] detected" or "Resume + GitHub: [skill] confirmed"
      - If no match found: "No evidence" (do NOT write empty string)
      - NEVER fabricate evidence — if a skill is not in the input data, mark type as "none"
      - FORBIDDEN evidence formats: "Some evidence", "Possibly in", "Appears to be", "관련 있을 수 있음", "경험이 있는 것 같음"

      # CONFIDENCE ↔ TYPE CONSISTENCY RULES (MANDATORY)
      - type="exact" → confidence MUST be ≥70
      - type="similar" → confidence MUST be 50-89
      - type="partial" → confidence MUST be 30-69
      - type="none" → confidence MUST be ≤30
      - Violations will be auto-corrected and flagged as quality issues

      # INPUT
      JD Requirements (top 6):
      {{jd_requirements}}

      Candidate Skills (Multi-source Unified — PRIMARY):
      {{unified_skills}}
      NOTE: Unified skills are merged from Resume, GitHub, LinkedIn, and Cover Letter.
      Each skill includes "sources" (which data sources confirmed it) and "category" (language/framework/tool/platform/concept).
      If unified_skills is empty [], fall back to Resume + GitHub skills below.

      Candidate Skills (Resume — FALLBACK):
      {{candidate_skills}}

      Candidate Skills (GitHub code analysis — FALLBACK):
      {{code_skills}}

      Analyzed Function Names (HYBRID pipeline — additional evidence, may be empty):
      {{code_functions}}

      # OUTPUT FORMAT (JSON array, one per JD requirement)
      [
        {{
          "skill": "JD requirement text in {{output_language}}",
          "candidate": "matched candidate skill name, or '—' if none",
          "type": "exact|similar|partial|none",
          "evidence": "specific source in {{output_language}} (e.g., 'Resume: Python listed' or 'GitHub: FastAPI detected in tech stack' or 'No evidence')",
          "confidence": 0-100
        }}
      ]

  decision_summary:
    description: "후보자 Decision Summary 생성 (근거 기반 레벨/강점/우려사항)"
    template: |
      # CRITICAL OUTPUT RULES
      - Return ONLY raw JSON, NO markdown formatting
      - Start your response with {{ and end with }}

      # ROLE
      You are a senior hiring manager making a data-driven hiring decision.
      Analyze the candidate holistically and produce a concise, evidence-based decision summary.

      # OUTPUT LANGUAGE (CRITICAL)
      Write ALL output text in {{output_language}}.
      The fields "experience", "jd_match", "strengths", and "concerns" MUST be written in {{output_language}}.
      JSON keys and "level" field must remain in English (Junior/Mid/Senior/Lead/Principal).
      Even if the input data is in another language, ALL output values MUST be in {{output_language}}.

      # TASK
      Based on the candidate's profile and JD requirements, generate:
      1. Experience summary (years + most recent role)
      2. JD match level (High/Medium/Low — translated to {{output_language}})
      3. Estimated level (Junior/Mid/Senior/Lead/Principal)
      4. Level classification evidence — cite SFIA/Dreyfus criteria + data source
      5. Key strengths — each MUST include evidence source in parentheses
      6. Key concerns — each MUST cite what data is missing or problematic

      # LEVEL ESTIMATION RULES (SFIA v9 / Dreyfus Model)
      - Junior: 0-2 years experience (SFIA 1-2)
      - Mid: 3-6 years experience (SFIA 3)
      - Senior: 7-9 years experience (SFIA 4)
      - Lead: 10-14 years experience (SFIA 5)
      - Principal: 15+ years experience (SFIA 6-7)
      - ALSO consider: leadership scope, architectural decisions, mentoring evidence
      - Experience years alone is insufficient — weigh role complexity and impact

      # JD MATCH THRESHOLDS
      - High: jd_match_score ≥ 0.75
      - Medium: jd_match_score 0.50-0.74
      - Low: jd_match_score < 0.50

      # MULTI-SOURCE DATA (JIT-43)
      The candidate_profile may contain enriched multi-source data:
      - "skills" with "skill_sources" mapping: shows which sources confirmed each skill (resume, github, linkedin)
      - "linkedin_experiences": LinkedIn-sourced career history (cross-reference with resume experiences)
      - "data_completeness": 0.0-1.0 score indicating how much data is available
      When multi-source data is available:
      - Prefer "(Multi-source)" tag for skills confirmed by 2+ sources
      - Use "(LinkedIn)" for LinkedIn-only data points
      - Cross-reference resume vs LinkedIn experiences for consistency checks

      # EVIDENCE RULES FOR STRENGTHS
      Each strength MUST end with a source tag in parentheses:
      - "(Resume)" — from candidate profile/skills
      - "(GitHub)" — from code analysis
      - "(Resume + GitHub)" — confirmed in both
      - "(LinkedIn)" — from LinkedIn profile data
      - "(Multi-source)" — confirmed across 2+ sources (resume, GitHub, LinkedIn)
      Example: "Python 5년 경험, FastAPI 프로젝트 3개 (Resume + GitHub)"
      Example: "AWS 인프라 운영 3년 (Multi-source)" — when confirmed in resume + LinkedIn

      # EVIDENCE RULES FOR CONCERNS
      Each concern MUST reference what triggered it:
      - Data gap: "GitHub 데이터 없어 코드 품질 검증 불가"
      - Skill gap: "JD 필수 요구사항 Kubernetes 관련 경험 없음 (Resume/GitHub 모두 미확인)"
      - Inconsistency: "이력서 경력 8년이나 GitHub 활동 2년만 확인"
      NEVER fabricate concerns not supported by input data.

      # FORBIDDEN PATTERNS (will cause rejection)
      - Strengths WITHOUT source tag: "뛰어난 기술력" ← REJECTED (no source)
      - Strengths with vague source: "다양한 경험이 풍부함" ← REJECTED (no specific skill cited)
      - Concerns NOT grounded in data: "의사소통 능력이 부족할 수 있음" ← REJECTED (no evidence)
      - EVERY strength MUST name a specific skill/achievement + source: "Python 5년, FastAPI 3개 프로젝트 (Resume + GitHub)" ← ACCEPTED
      - EVERY concern MUST cite the data gap or contradiction: "JD 필수 Kubernetes 경험 없음 (Resume/GitHub 미확인)" ← ACCEPTED

      # CROSS-CONSISTENCY CHECK
      - strengths should align with high-scoring areas
      - concerns should align with low-scoring areas or data gaps
      - jd_match should be consistent with jd_match_score value

      # INPUT
      JD Analysis:
      {{jd_analysis}}

      Candidate Profile:
      {{candidate_profile}}

      Candidate Summary:
      {{candidate_summary}}

      JD Match Score (0-1):
      {{jd_match_score}}

      # ADDITIONAL CONTEXT (may be empty)
      {{kg_context}}

      # CODE ANALYSIS DEPTH (may be empty — only present for HYBRID pipeline)
      {{code_depth_context}}

      # OUTPUT FORMAT
      {{
        "experience": "experience summary in {{output_language}} (e.g., '8년 (Senior Backend Engineer @ TechCorp)')",
        "jd_match": "High|Medium|Low (translated to {{output_language}})",
        "level": "Junior|Mid|Senior|Lead|Principal",
        "level_evidence": "SFIA/Dreyfus classification reason in {{output_language}} — MUST cite data source (e.g., 'SFIA Level 4: 경력 8년 + 아키텍처 의사결정 경험 (Resume + GitHub)')",
        "strengths": ["strength1 (source) in {{output_language}}", "strength2 (source)", ...],
        "concerns": ["concern1 with evidence in {{output_language}}", "concern2 with evidence", ...]
      }}

  interviewer_tips:
    description: "면접관 가이드 팁 생성 (후보자 맞춤)"
    template: |
      # CRITICAL OUTPUT RULES
      - Return ONLY raw JSON, NO markdown formatting
      - Start your response with {{ and end with }}

      # ROLE
      You are a senior interviewer coach preparing a hiring manager for a technical interview.
      Generate actionable, candidate-specific interview guidance.

      # OUTPUT LANGUAGE (CRITICAL)
      Write ALL output text in {{output_language}}.
      ALL fields (resume_based_tips, cover_letter_insights, red_flags_to_watch) MUST be in {{output_language}}.
      JSON keys must remain in English.
      Even if the input data is in another language, ALL output values MUST be in {{output_language}}.

      # TASK
      Based on the candidate's profile and generated questions, create:
      1. Resume-based verification tips (specific claims to verify)
      2. Cover letter insights (claims to validate)
      3. Red flags to watch for during interview — each MUST include the data source in parentheses
         Example: "GitHub 활동이 최근 6개월간 없음 (GitHub)" or "이력서 경력 갭 2023-2024 (Resume)"

      # MULTI-SOURCE DATA (JIT-43/50)
      The candidate_profile may contain enriched multi-source data:
      - "unified_skills": skills with source attribution (resume, github, linkedin)
      - "linkedin_experiences": LinkedIn career history for cross-referencing with resume
      - "linkedin_honors": certifications, awards from LinkedIn
      - "recommendations_summary": LLM-generated summary of LinkedIn recommendations
      - "volunteer_summary": LLM-generated summary of volunteer experience
      When multi-source data is available:
      - Cross-reference resume claims with LinkedIn data for verification tips
      - Note discrepancies between resume and LinkedIn as red flags
      - Use LinkedIn honors/certifications as positive verification points
      - Tag red flags with the specific source: "(Resume)", "(GitHub)", "(LinkedIn)", "(Resume vs LinkedIn)"
      - If recommendations_summary is available, use it to identify strengths confirmed by others
      - If volunteer_summary is available, assess candidate's leadership and values

      # INPUT
      Questions:
      {{questions}}

      Candidate Profile:
      {{candidate_profile}}

      Cover Letter Analysis:
      {{cover_letter}}

      Job Title:
      {{job_title}}

      # ADDITIONAL CONTEXT (may be empty)
      {{kg_context}}

      # FORBIDDEN PATTERNS (will cause rejection)
      - Red flags WITHOUT data source: "기술 부족 우려" ← REJECTED (no parenthesized source)
      - EVERY red flag MUST end with (Resume), (GitHub), or (LinkedIn): "경력 갭 2023-2024 (Resume)" ← ACCEPTED

      # OUTPUT FORMAT
      {{
        "resume_based_tips": [
          {{"section": "area to verify in {{output_language}}", "insight": "specific verification method in {{output_language}}", "question_link": "related question ref (e.g., Q1, Q3) or null"}}
        ],
        "cover_letter_insights": [
          {{"highlight": "key claim in {{output_language}}", "interpretation": "verification question in {{output_language}}", "follow_up_opportunity": "follow-up opportunity in {{output_language}} or null"}}
        ],
        "red_flags_to_watch": ["concern1 in {{output_language}}", "concern2"]
      }}
