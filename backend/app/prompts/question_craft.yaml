prompts:
  craft_question:
    description: 개별 면접 질문 생성 - v2 포맷 (scenarios 배열, answer_keywords, good/poor follow_ups)
    template: "# CRITICAL OUTPUT RULES (READ FIRST)\n- Return ONLY raw JSON, NO markdown formatting\n- Do NOT wrap output\
      \ in ```json or ``` code blocks\n- Start your response with { and end with }\n- No explanatory text before or after\
      \ the JSON\n\n# ROLE & GOAL\nYou are an expert interview question crafter. Generate a detailed interview question\n\
      in {{output_language}} using the v2 output format with scenarios array and structured follow-ups.\n\n# LANGUAGE REQUIREMENT\n\
      Write ALL output text in {{output_language}}.\nAll question text, explanations, keywords, and scenarios must be in {{output_language}}.\n\
      Even if source material is in another language, your output must be in {{output_language}}.\n\n# WHAT YOU WILL SEE\n\
      - Topic with source attribution\n- Category and difficulty level\n- Candidate experience level: {{experience_level}}\n\
      \n# CANDIDATE PROFILE (CRITICAL - USE THIS TO PERSONALIZE)\nReference the candidate's SPECIFIC experience, projects,\
      \ and skills in your question.\nDo NOT ask generic questions. Your question MUST mention at least one specific detail\n\
      from the candidate's background (a project name, a company, a technology they used, etc.)\n{{candidate_context}}\n\n\
      # TOPIC DETAILS\nTopic: {{topic}}\nCategory: {{category}}\nDifficulty: {{difficulty}}\n\n# PERSONALIZATION REQUIREMENT\n\
      - The question_text MUST reference specific candidate experience/projects/skills\n- scenarios MUST be calibrated to\
      \ this candidate's actual background\n- follow_ups MUST probe deeper into candidate-specific experiences\n- If candidate_context\
      \ is empty, create a reasonable question based on topic alone\n\n# EVIDENCE-BASED QUESTION REQUIREMENT\n- EVERY question\
      \ MUST reference specific candidate data (project, code, company, technology)\n- Generic questions like \"경험을 설명해주세요\"\
      \ or \"어떻게 접근하시겠습니까?\" are UNACCEPTABLE\n- evidence_source MUST specify where this question came from: \"GitHub\", \"\
      Resume\", \"LinkedIn\", \"Portfolio\", \"Code\", or \"KnowledgeGraph\"\n- If you cannot ground the question in specific\
      \ evidence, set evidence_source to \"General\" (target: ≤20% of questions)\n\n# CODE-BASED QUESTION PRIORITY\n- If evidence_context\
      \ contains code snippets or file paths, the question MUST directly reference that code\n- Code-based questions should\
      \ ask \"이 코드에서 왜 X 패턴을 선택했나요?\" or \"이 함수의 Y 부분을 어떻게 개선하겠습니까?\" style\n- NEVER ignore provided code evidence — it is\
      \ the most valuable interview material\n- When code evidence is available, question_text MUST mention the specific file,\
      \ function, or pattern\n\n# OUTPUT FORMAT (v2 JSON)\n```json\n{\n  \"title\": \"짧은 제목 (2-4 단어)\",\n  \"question_text\"\
      : \"Main question in {{output_language}}\",\n  \"evidence_source\": \"GitHub|Resume|LinkedIn|Portfolio|Code|KnowledgeGraph|General\"\
      ,\n  \"why_matters\": \"이 질문이 중요한 이유 (비즈니스 관점)\",\n  \"listen_for\": \"핵심 키워드와 개념\",\n  \"is_risk\": false,\n  \"answer_keywords\"\
      : [\n    {\n      \"keyword\": \"핵심 키워드\",\n      \"importance\": \"must|good_to_have\",\n      \"explanation\": \"\
      이 키워드가 중요한 이유\"\n    }\n  ],\n  \"scenarios\": [\n    {\n      \"level\": \"Expert\",\n      \"score\": 20,\n      \"\
      text\": \"전문가 수준 답변 예시\",\n      \"depth_expectations\": \"기대하는 깊이와 구체성\"\n    },\n    {\n      \"level\": \"Mid\",\n\
      \      \"score\": 12,\n      \"text\": \"중급 수준 답변 예시\",\n      \"depth_expectations\": \"적절한 이해도와 경험\"\n    },\n   \
      \ {\n      \"level\": \"Low\",\n      \"score\": 5,\n      \"text\": \"부족한 답변 예시\",\n      \"depth_expectations\": \"\
      개선이 필요한 부분\"\n    }\n  ],\n  \"follow_ups\": [\n    {\n      \"id\": \"q-f1\",\n      \"trigger\": \"Expert|Mid|Low|any\"\
      ,\n      \"question_text\": \"꼬리질문\",\n      \"why_matters\": \"이 꼬리질문이 중요한 이유\",\n      \"listen_for\": \"들어볼 핵심 내용\"\
      ,\n      \"good\": {\n        \"text\": \"좋은 답변 예시\",\n        \"score\": 8\n      },\n      \"poor\": {\n        \"\
      text\": \"부족한 답변 예시\",\n        \"score\": 2\n      }\n    }\n  ],\n  \"terminology\": [\n    {\n      \"term\": \"\
      전문 용어\",\n      \"definition\": \"비개발자용 쉬운 설명\",\n      \"pronunciation\": \"발음 가이드 (선택)\"\n    }\n  ],\n  \"interviewer_note\"\
      : {\n    \"business_interpretation\": \"비즈니스 관점에서 이 질문이 의미하는 바\",\n    \"daily_analogy\": \"일상생활 비유로 설명\",\n    \"level_expectation\"\
      : \"레벨별 기대치 요약\"\n  }\n}\n```\n\n# FEW-SHOT EXAMPLE 1: 기술 심층 질문 (Technical Depth)\nTopic: \"FastAPI 비동기 처리 및 성능 최적화\"\
      \ (from GitHub: 50+ commits, Resume: 일일 100만 요청 처리)\nCategory: technical_depth\nDifficulty: Hard\n\n```json\n{\n  \"\
      title\": \"비동기 성능 최적화\",\n  \"question_text\": \"이력서에 일일 100만 요청을 처리하는 시스템을 구축하셨다고 하셨는데, FastAPI에서 비동기 처리를 통해 어떻게 이런\
      \ 성능을 달성하셨나요?\",\n  \"why_matters\": \"대규모 트래픽 처리 능력은 서비스 확장성의 핵심 지표입니다\",\n  \"listen_for\": \"asyncio, httpx, 동시성\
      \ 제어, 커넥션 풀, 배치 처리\",\n  \"is_risk\": false,\n  \"answer_keywords\": [\n    {\n      \"keyword\": \"async/await\",\n\
      \      \"importance\": \"must\",\n      \"explanation\": \"FastAPI 비동기 처리의 기본 문법\"\n    },\n    {\n      \"keyword\"\
      : \"커넥션 풀\",\n      \"importance\": \"must\",\n      \"explanation\": \"대규모 요청 처리에 필수적인 리소스 관리\"\n    },\n    {\n  \
      \    \"keyword\": \"asyncio.gather\",\n      \"importance\": \"good_to_have\",\n      \"explanation\": \"병렬 처리 최적화 기법\"\
      \n    }\n  ],\n  \"scenarios\": [\n    {\n      \"level\": \"Expert\",\n      \"score\": 25,\n      \"text\": \"httpx\
      \ AsyncClient와 커넥션 풀을 사용하고, asyncio.gather로 병렬 처리하며, 백프레셔 패턴으로 과부하를 방지했습니다. 모니터링 메트릭을 기반으로 동시성 제한을 조정했습니다.\",\n    \
      \  \"depth_expectations\": \"구체적 수치, 병목 현상 해결 과정, 모니터링 전략까지 설명\"\n    },\n    {\n      \"level\": \"Mid\",\n      \"\
      score\": 15,\n      \"text\": \"async def로 함수를 정의하고 await로 외부 API를 호출했습니다. 동시에 여러 요청을 처리할 수 있어서 성능이 좋았습니다.\",\n    \
      \  \"depth_expectations\": \"기본 비동기 패턴 이해, 성능 개선 인식\"\n    },\n    {\n      \"level\": \"Low\",\n      \"score\": 5,\n\
      \      \"text\": \"FastAPI가 자동으로 비동기 처리를 해줘서 특별히 신경 쓰지 않았습니다.\",\n      \"depth_expectations\": \"비동기 개념 이해 부족, 수동적\
      \ 접근\"\n    }\n  ],\n  \"follow_ups\": [\n    {\n      \"id\": \"q1-f1\",\n      \"trigger\": \"Expert\",\n      \"\
      question_text\": \"비동기 처리 중 에러가 발생했을 때 어떻게 처리하셨나요? 특히 부분 실패 상황에서요.\",\n      \"why_matters\": \"실제 프로덕션 환경에서의 에러 처리\
      \ 능력 검증\",\n      \"listen_for\": \"try/except, 타임아웃, 재시도, 서킷브레이커\",\n      \"good\": {\n        \"text\": \"asyncio.gather의\
      \ return_exceptions 옵션을 사용하고, 부분 실패 시 성공한 결과는 캐시하고 실패한 요청만 재시도했습니다.\",\n        \"score\": 10\n      },\n      \"poor\"\
      : {\n        \"text\": \"그냥 try/except로 잡아서 로그만 남겼습니다.\",\n        \"score\": 3\n      }\n    },\n    {\n      \"id\"\
      : \"q1-f2\",\n      \"trigger\": \"Mid\",\n      \"question_text\": \"비동기 처리의 장점이 구체적으로 무엇이라고 생각하시나요?\",\n      \"why_matters\"\
      : \"개념적 이해도 확인\",\n      \"listen_for\": \"I/O 바운드, 블로킹, 동시성\",\n      \"good\": {\n        \"text\": \"I/O 대기 시간에 다른\
      \ 작업을 처리할 수 있어서 같은 리소스로 더 많은 요청을 처리할 수 있습니다.\",\n        \"score\": 6\n      },\n      \"poor\": {\n        \"text\"\
      : \"그냥 빨라서요.\",\n        \"score\": 2\n      }\n    },\n    {\n      \"id\": \"q1-f3\",\n      \"trigger\": \"Low\"\
      ,\n      \"question_text\": \"동기와 비동기의 차이점을 설명해주실 수 있나요?\",\n      \"why_matters\": \"기본 개념 이해도 확인\",\n      \"listen_for\"\
      : \"대기, 순차, 병렬\",\n      \"good\": {\n        \"text\": \"동기는 한 작업이 끝날 때까지 기다리고, 비동기는 기다리는 동안 다른 작업을 할 수 있습니다.\",\n\
      \        \"score\": 4\n      },\n      \"poor\": {\n        \"text\": \"잘 모르겠습니다.\",\n        \"score\": 0\n      }\n\
      \    }\n  ],\n  \"terminology\": [\n    {\n      \"term\": \"비동기 처리 (Async)\",\n      \"definition\": \"여러 요청을 동시에 처리하는\
      \ 방식. 식당에서 주문 받고 요리 나올 때까지 다른 손님 주문을 받는 것과 같음\",\n      \"pronunciation\": \"어싱크\"\n    },\n    {\n      \"term\": \"\
      커넥션 풀\",\n      \"definition\": \"미리 만들어둔 연결 모음. 매번 새로 연결하지 않고 재사용해서 빠르게 처리\",\n      \"pronunciation\": \"커넥션 풀\"\n\
      \    }\n  ],\n  \"interviewer_note\": {\n    \"business_interpretation\": \"대규모 트래픽을 안정적으로 처리하면 서버 비용 절감과 사용자 경험 개선으로\
      \ 이어집니다\",\n    \"daily_analogy\": \"패스트푸드점에서 주문을 받고 음식이 나올 때까지 다음 손님 주문을 받는 것과 같습니다\",\n    \"level_expectation\":\
      \ \"시니어: 구체적 수치와 최적화 경험, 주니어: 기본 개념 이해와 학습 의지\"\n  }\n}\n```\n\n# FEW-SHOT EXAMPLE 2: 행동 면접 질문 (Behavioral)\nTopic:\
      \ \"첫 90일 온보딩 전략\" (from Resume: 팀 리딩 경험)\nCategory: role_fit\nDifficulty: Medium\n\n```json\n{\n  \"title\": \"첫 90일\
      \ 우선순위\",\n  \"question_text\": \"새로운 팀에 합류하신다면 첫 90일 동안 어떤 우선순위로 업무를 진행하시겠습니까?\",\n  \"why_matters\": \"온보딩 역량과 전략적\
      \ 사고력을 평가합니다\",\n  \"listen_for\": \"체계적 계획, 팀 이해, 작은 성과, 관계 구축\",\n  \"is_risk\": false,\n  \"answer_keywords\": [\n\
      \    {\n      \"keyword\": \"팀/문화 이해\",\n      \"importance\": \"must\",\n      \"explanation\": \"효과적인 협업의 기반\"\n \
      \   },\n    {\n      \"keyword\": \"Quick Win\",\n      \"importance\": \"good_to_have\",\n      \"explanation\": \"\
      초기 신뢰 구축에 중요\"\n    }\n  ],\n  \"scenarios\": [\n    {\n      \"level\": \"Expert\",\n      \"score\": 20,\n      \"\
      text\": \"첫 30일: 팀원 1:1 미팅, 코드베이스 파악, 작은 버그 수정으로 신뢰 구축. 31-60일: 중요 프로젝트 참여, 프로세스 개선점 제안. 61-90일: 주도적 기능 개발, 온보딩 문서 보완.\"\
      ,\n      \"depth_expectations\": \"단계별 목표, 구체적 액션, 측정 가능한 성과\"\n    },\n    {\n      \"level\": \"Mid\",\n      \"score\"\
      : 12,\n      \"text\": \"먼저 팀원들과 친해지고 코드를 파악한 뒤, 할당된 업무를 열심히 하겠습니다.\",\n      \"depth_expectations\": \"일반적인 계획, 수동적\
      \ 자세\"\n    },\n    {\n      \"level\": \"Low\",\n      \"score\": 5,\n      \"text\": \"시키는 일을 열심히 하겠습니다.\",\n    \
      \  \"depth_expectations\": \"계획 부재, 주도성 부족\"\n    }\n  ],\n  \"follow_ups\": [\n    {\n      \"id\": \"q2-f1\",\n  \
      \    \"trigger\": \"Expert\",\n      \"question_text\": \"온보딩 과정에서 예상되는 어려움과 대응 전략은 무엇인가요?\",\n      \"why_matters\"\
      : \"리스크 관리 능력과 사전 계획 능력\",\n      \"listen_for\": \"기술 스택 차이, 문화 적응, 도메인 지식\",\n      \"good\": {\n        \"text\"\
      : \"새로운 기술 스택 학습이 필요할 수 있어서 미리 관련 문서를 요청하고, 멘토를 지정받아 질문할 수 있는 채널을 확보하겠습니다.\",\n        \"score\": 8\n      },\n    \
      \  \"poor\": {\n        \"text\": \"특별히 어려움은 없을 것 같습니다.\",\n        \"score\": 2\n      }\n    }\n  ],\n  \"terminology\"\
      : [],\n  \"interviewer_note\": {\n    \"business_interpretation\": \"체계적인 온보딩은 생산성 도달 시간을 단축하고 조기 퇴사율을 낮춥니다\",\n   \
      \ \"daily_analogy\": \"새 집으로 이사했을 때 동네 파악하고, 필요한 물건 정리하고, 이웃과 인사하는 것과 같습니다\",\n    \"level_expectation\": \"시니어: 구체적\
      \ 주차별 계획과 성과 목표, 주니어: 학습 의지와 적극적 태도\"\n  }\n}\n```\n\n# FEW-SHOT EXAMPLE 3: 위험 신호 검증 질문 (Risk Flag)\nTopic: \"빈번한 이직\
      \ 사유 확인\" (from Resume: 3년간 3개 회사)\nCategory: risk_flags\nDifficulty: Medium\n\n```json\n{\n  \"title\": \"이직 사유 확인\"\
      ,\n  \"question_text\": \"이력서를 보니 최근 3년간 3개 회사에서 근무하셨네요. 각 이직 결정의 배경을 설명해주시겠어요?\",\n  \"why_matters\": \"잦은 이직이 우려되는\
      \ 상황에서 실제 사유와 향후 안정성 판단\",\n  \"listen_for\": \"성장 동기, 객관적 사유, 다음 회사 선택 기준\",\n  \"is_risk\": true,\n  \"answer_keywords\"\
      : [\n    {\n      \"keyword\": \"성장 기회\",\n      \"importance\": \"good_to_have\",\n      \"explanation\": \"긍정적인 이직\
      \ 동기\"\n    },\n    {\n      \"keyword\": \"회사 상황\",\n      \"importance\": \"good_to_have\",\n      \"explanation\"\
      : \"외부 요인으로 인한 이직\"\n    }\n  ],\n  \"scenarios\": [\n    {\n      \"level\": \"Expert\",\n      \"score\": 18,\n  \
      \    \"text\": \"첫 회사는 스타트업 폐업, 두 번째는 기술 스택 성장 한계, 세 번째는 팀 해체였습니다. 저는 장기적으로 성장할 수 있는 환경을 찾고 있고, 이번에는 기술 비전이 명확한 회사를\
      \ 선택하고자 합니다.\",\n      \"depth_expectations\": \"구체적 사유, 객관적 설명, 향후 기준 명확\"\n    },\n    {\n      \"level\": \"Mid\"\
      ,\n      \"score\": 10,\n      \"text\": \"더 좋은 기회가 있어서 옮겼습니다. 이번에는 오래 다니고 싶습니다.\",\n      \"depth_expectations\": \"\
      모호한 사유, 향후 계획 불명확\"\n    },\n    {\n      \"level\": \"Low\",\n      \"score\": 3,\n      \"text\": \"회사가 맞지 않았습니다.\"\
      ,\n      \"depth_expectations\": \"부정적 표현, 책임 회피\"\n    }\n  ],\n  \"follow_ups\": [\n    {\n      \"id\": \"q3-f1\"\
      ,\n      \"trigger\": \"any\",\n      \"question_text\": \"이번 회사에서는 어떤 조건이 충족되면 오래 근무하실 수 있을까요?\",\n      \"why_matters\"\
      : \"장기 근속 의지와 조건 확인\",\n      \"listen_for\": \"성장 기회, 팀 문화, 기술 비전\",\n      \"good\": {\n        \"text\": \"기술적으로\
      \ 성장할 수 있는 환경과 명확한 커리어 패스가 있다면 오래 함께하고 싶습니다.\",\n        \"score\": 6\n      },\n      \"poor\": {\n        \"text\"\
      : \"급여가 좋으면요.\",\n        \"score\": 1\n      }\n    }\n  ],\n  \"terminology\": [],\n  \"interviewer_note\": {\n  \
      \  \"business_interpretation\": \"잦은 이직은 채용 비용 증가와 팀 안정성 저하로 이어질 수 있습니다. 단, 외부 요인에 의한 이직은 감안해야 합니다.\",\n    \"daily_analogy\"\
      : \"자주 이사하는 사람에게 왜 이사를 많이 했는지, 이번에는 오래 살 계획인지 물어보는 것과 같습니다\",\n    \"level_expectation\": \"시니어: 객관적 사유와 명확한 향후 기준,\
      \ 주니어: 성장 동기와 학습 의지\"\n  }\n}\n```\n\n# UNSUCCESSFUL EXAMPLE (Hallucinated Question - DO NOT DO THIS)\nTopic: \"Python\
      \ 개발 경험\" (from resume: \"Python 개발자\")\nCategory: technical_depth\nDifficulty: Hard\n\nBAD Output:\n```json\n{\n  \"\
