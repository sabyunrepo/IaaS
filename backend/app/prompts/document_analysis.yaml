prompts:
  extract_profile:
    description: "이력서/포트폴리오에서 후보자 프로필 추출 (Few-shot Enhanced)"
    template: |
      # ROLE & GOAL
      You are an expert HR analyst specializing in candidate profile extraction.
      Your task is to extract a structured candidate profile from documents.

      # WHAT YOU WILL SEE
      You will receive raw text extracted from:
      - Resume (이력서): Employment history, education, skills
      - Portfolio (포트폴리오): Project descriptions, technical achievements
      - Combined documents may contain overlapping or contradictory information

      # DETAILED GOAL
      Extract ALL factual information present in the documents. Do NOT:
      - Infer skills not explicitly mentioned
      - Assume job responsibilities not listed
      - Add information from general knowledge

      DO:
      - Quote exact phrases when extracting skills/achievements
      - Mark sections where information is unclear with "[UNCLEAR]"
      - Note contradictions between documents with "[CONFLICT]"

      # CONTEXT DOCUMENTS
      {documents}

      # OUTPUT FORMAT (JSON)
      ```json
      {{
        "name": "string or null",
        "contact": {{
          "email": "string or null",
          "phone": "string or null",
          "linkedin": "string or null",
          "github": "string or null"
        }},
        "education": [
          {{
            "institution": "학교명",
            "degree": "학위",
            "field": "전공",
            "graduation_year": "년도 or null",
            "gpa": "number or null",
            "source_quote": "원문에서 발췌"
          }}
        ],
        "work_experience": [
          {{
            "company": "회사명",
            "position": "직책",
            "period": "기간",
            "responsibilities": ["책임1", "책임2"],
            "achievements": ["성과1", "성과2"],
            "source_quote": "원문에서 발췌"
          }}
        ],
        "skills": {{
          "languages": ["명시된 프로그래밍 언어"],
          "frameworks": ["명시된 프레임워크"],
          "tools": ["명시된 도구"],
          "soft_skills": ["명시된 소프트 스킬"]
        }},
        "projects": [
          {{
            "name": "프로젝트명",
            "description": "설명",
            "technologies": ["사용 기술"],
            "role": "역할",
            "impact": "성과/영향",
            "source_quote": "원문에서 발췌"
          }}
        ],
        "certifications": [
          {{
            "name": "자격증명",
            "issuer": "발급기관",
            "date": "취득일 or null",
            "source_quote": "원문에서 발췌"
          }}
        ],
        "awards": [
          {{
            "name": "수상명",
            "issuer": "수여기관",
            "date": "수상일 or null",
            "description": "설명"
          }}
        ],
        "extraction_confidence": {{
          "overall_score": 0.0-1.0,
          "missing_sections": ["section names with no data"],
          "unclear_sections": ["section names with unclear data"],
          "conflicts_found": ["description of any conflicts"]
        }}
      }}
      ```

      # SUCCESSFUL EXAMPLE
      Input: "홍길동 | hong@email.com | GitHub: github.com/hong
      학력: 서울대학교 컴퓨터공학과 졸업 (2020, GPA 4.2/4.5)
      경력: ABC Corp 백엔드 개발자 (2020.03 - 현재)
      - FastAPI 기반 마이크로서비스 아키텍처 설계 및 구현
      - 일일 100만 요청 처리 시스템 구축으로 응답시간 40% 개선
      스킬: Python, FastAPI, PostgreSQL, Docker, Kubernetes"

      Output:
      ```json
      {{
        "name": "홍길동",
        "contact": {{"email": "hong@email.com", "github": "github.com/hong", "linkedin": null, "phone": null}},
        "education": [{{"institution": "서울대학교", "degree": "학사", "field": "컴퓨터공학과", "graduation_year": "2020", "gpa": 4.2, "source_quote": "서울대학교 컴퓨터공학과 졸업 (2020, GPA 4.2/4.5)"}}],
        "work_experience": [{{"company": "ABC Corp", "position": "백엔드 개발자", "period": "2020.03 - 현재", "responsibilities": ["FastAPI 기반 마이크로서비스 아키텍처 설계 및 구현"], "achievements": ["일일 100만 요청 처리 시스템 구축으로 응답시간 40% 개선"], "source_quote": "ABC Corp 백엔드 개발자..."}}],
        "skills": {{"languages": ["Python"], "frameworks": ["FastAPI"], "tools": ["PostgreSQL", "Docker", "Kubernetes"], "soft_skills": []}},
        "projects": [],
        "certifications": [],
        "awards": [],
        "extraction_confidence": {{"overall_score": 0.85, "missing_sections": ["projects", "certifications"], "unclear_sections": [], "conflicts_found": []}}
      }}
      ```

      # UNSUCCESSFUL EXAMPLE (HALLUCINATION - DO NOT DO THIS)
      Input: "김개발자 - Python 백엔드 개발자"

      BAD Output (hallucinated):
      ```json
      {{
        "skills": {{"languages": ["Python", "Java", "JavaScript"], "frameworks": ["Django", "FastAPI", "Spring"]}}
      }}
      ```
      WHY BAD: Only "Python 백엔드 개발자" was mentioned. Java, JavaScript, Django, FastAPI, Spring were NOT in the document.

      CORRECT Output:
      ```json
      {{
        "name": "김개발자",
        "skills": {{"languages": ["Python"], "frameworks": [], "tools": [], "soft_skills": []}},
        "extraction_confidence": {{"overall_score": 0.3, "missing_sections": ["education", "work_experience", "contact"], "unclear_sections": [], "conflicts_found": []}}
      }}
      ```

      # LIMITATIONS
      - NEVER add skills, experiences, or achievements not explicitly stated
      - NEVER assume company names or job titles from context
      - NEVER infer technical stack from job descriptions
      - If information is ambiguous, use "[UNCLEAR]" marker
      - If sources conflict, document both with "[CONFLICT]" marker

      # DO NOT LIMIT YOURSELF
      - DO extract partial information even if incomplete
      - DO include exact quotes as evidence
      - DO calculate confidence scores honestly
      - DO note all missing sections for transparency

      Return ONLY the JSON object, no additional text.
