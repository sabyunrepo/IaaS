prompts:
  enhance_terminology:
    description: 질문 내 전문용어에 비개발자용 설명 추가
    template: "# CRITICAL OUTPUT RULES (READ FIRST)\n- Return ONLY raw JSON, NO markdown formatting\n- Do NOT wrap output\
      \ in ```json or ``` code blocks\n- Start your response with { and end with }\n- No explanatory text before or after\
      \ the JSON\n\n# ROLE & GOAL\nYou are a technical translator who makes complex terms accessible to non-technical interviewers.\n\
      \n# WHAT YOU WILL SEE\nInterview questions containing technical terminology that HR managers or hiring managers may\
      \ not understand.\n\n# QUESTIONS TO ENHANCE\n{{questions_json}}\n\n# LANGUAGE REQUIREMENT\nWrite ALL output text in\
      \ {{output_language}}.\nAll explanations, descriptions, and terminology must be in {{output_language}}.\nEven if input\
      \ questions are in another language, your output must be in {{output_language}}.\n\n# OUTPUT FORMAT (JSON)\nUse each\
      \ question's \"id\" field (e.g. \"q-tech-a1b2c3d4\") as the key.\n```json\n{\n  \"q-tech-a1b2c3d4\": [\n    {\n    \
      \  \"term\": \"Technical term\",\n      \"plain_language_explanation\": \"Everyday analogy or simple description\",\n\
      \      \"business_context\": \"Why this matters for business outcomes\",\n      \"pronunciation_guide\": \"How to say\
      \ it (if non-obvious)\"\n    }\n  ]\n}\n```\n\n# EXAMPLE\nTerm: \"마이크로서비스 아키텍처\"\n```json\n{\n  \"term\": \"마이크로서비스\
      \ 아키텍처\",\n  \"plain_language_explanation\": \"레고 블록처럼 작은 서비스들을 조립해서 큰 시스템을 만드는 방식. 하나가 고장나도 전체가 멈추지 않음\",\n  \"business_context\"\
      : \"시스템 일부만 업데이트할 수 있어 배포 속도가 빠르고, 장애 영향 범위가 작아 서비스 안정성이 높음\",\n  \"pronunciation_guide\": \"마이크로-서비스 아키텍처\"\n}\n```\n\
      \n# QUALITY RULES (MANDATORY)\n- plain_language_explanation MUST be ≥15 characters — short phrases are REJECTED\n- NEVER\
      \ define a term by repeating itself: \"API는 API입니다\" ← REJECTED\n- Use everyday analogies that a non-technical person\
      \ would understand\n- business_context MUST explain real impact (cost, speed, reliability) — not just \"중요합니다\"\n- Do\
      \ NOT duplicate the same term across different questions\n\nREMINDER: Return raw JSON only. Do NOT use markdown code\
      \ blocks. Start with { and end with }.\n"
  craft_evaluation_scenarios:
    description: 3단계 평가 시나리오 텍스트 생성
    template: "# CRITICAL OUTPUT RULES (READ FIRST)\n- Return ONLY raw JSON, NO markdown formatting\n- Do NOT wrap output\
      \ in ```json or ``` code blocks\n- Start your response with { and end with }\n- No explanatory text before or after\
      \ the JSON\n\n# ROLE & GOAL\nYou create detailed evaluation scenarios for interviewers to assess candidate responses.\n\
      \n# QUESTIONS TO CREATE SCENARIOS FOR\nExperience Level: {{experience_level}}\n{{questions_json}}\n\n# LANGUAGE REQUIREMENT\n\
      Write ALL output text in {{output_language}}.\nAll scenario descriptions, keywords, and behavioral indicators must be\
      \ in {{output_language}}.\n\n# OUTPUT FORMAT (JSON)\nFor each question, use its \"id\" field (e.g. \"q-tech-a1b2c3d4\"\
      ) as the key.\nCreate scenarios at three levels:\n```json\n{\n  \"q-tech-a1b2c3d4\": {\n    \"expert\": {\n      \"\
      description\": \"What expert-level response looks like\",\n      \"trigger_keywords\": [\"specific terms that indicate\
      \ expertise\"],\n      \"behavioral_indicators\": [\"what candidate does/says\"],\n      \"follow_up_direction\": \"\
      Where to probe deeper\"\n    },\n    \"mid_level\": {\n      \"description\": \"What adequate response looks like\"\
      ,\n      \"trigger_keywords\": [\"basic understanding indicators\"],\n      \"behavioral_indicators\": [\"typical mid-level\
      \ responses\"],\n      \"coaching_tip\": \"How to help them elaborate\"\n    },\n    \"low_level\": {\n      \"description\"\
      : \"What insufficient response looks like\",\n      \"trigger_keywords\": [\"red flag phrases\"],\n      \"behavioral_indicators\"\
      : [\"concerning responses\"],\n      \"recovery_question\": \"Question to give them another chance\"\n    }\n  }\n}\n\
      ```\n\n# DISCRIMINABILITY RULES (MANDATORY)\n- expert and low_level descriptions MUST be clearly different — do NOT\
      \ use similar wording\n- expert: cite specific numbers, metrics, architecture patterns, or trade-off analysis\n- low_level:\
      \ describe vague responses, surface-level answers, or avoidance of specifics\n- EVERY description MUST be ≥15 characters\
      \ (short generic phrases are REJECTED)\n- trigger_keywords for expert and low_level MUST NOT overlap\n\nREMINDER: Return\
      \ raw JSON only. Do NOT use markdown code blocks. Start with { and end with }.\n"
  design_follow_ups:
    description: 후속질문 분기 설계 (Expert/Mid/Low 트리거별)
    template: "# CRITICAL OUTPUT RULES (READ FIRST)\n- Return ONLY raw JSON, NO markdown formatting\n- Do NOT wrap output\
      \ in ```json or ``` code blocks\n- Start your response with { and end with }\n- No explanatory text before or after\
      \ the JSON\n\n# ROLE & GOAL\nDesign follow-up question branches based on candidate response quality.\n\n# QUESTIONS\
      \ TO DESIGN FOLLOW-UPS FOR\nExperience Level: {{experience_level}}\n{{questions_json}}\n\n# LANGUAGE REQUIREMENT\nWrite\
      \ ALL output text in {{output_language}}.\nAll follow-up questions and purposes must be in {{output_language}}.\n\n\
      # OUTPUT FORMAT (JSON)\nUse each question's \"id\" field (e.g. \"q-tech-a1b2c3d4\") as the key.\n```json\n{\n  \"q-tech-a1b2c3d4\"\
      : [\n    {\n      \"trigger\": \"expert|mid|low\",\n      \"question_text\": \"Follow-up question\",\n      \"purpose\"\
      : \"What this reveals about candidate\",\n      \"expected_insight\": \"What good answer would show\"\n    }\n  ]\n\
      }\n```\n\nREMINDER: Return raw JSON only. Do NOT use markdown code blocks. Start with { and end with }.\n"
  generate_interviewer_notes:
    description: 면접관 참고 노트 생성 (비즈니스 해석, 일상 비유)
    template: "# CRITICAL OUTPUT RULES (READ FIRST)\n- Return ONLY raw JSON, NO markdown formatting\n- Do NOT wrap output\
      \ in ```json or ``` code blocks\n- Start your response with { and end with }\n- No explanatory text before or after\
      \ the JSON\n\n# ROLE & GOAL\nGenerate guidance notes for non-technical interviewers conducting technical interviews.\n\
      \n# QUESTIONS TO GENERATE NOTES FOR\n{{questions_json}}\n\n# LANGUAGE REQUIREMENT\nWrite ALL output text in {{output_language}}.\n\
      All notes, analogies, and guidance must be in {{output_language}}.\n\n# OUTPUT FORMAT (JSON)\nUse each question's \"\
      id\" field (e.g. \"q-tech-a1b2c3d4\") as the key.\n```json\n{\n  \"q-tech-a1b2c3d4\": {\n    \"business_interpretation\"\
      : \"What this question reveals in business terms\",\n    \"daily_analogy\": \"Everyday situation that parallels this\
      \ technical concept\",\n    \"level_expectation\": \"What to expect from this experience level (e.g. 시니어: 구체적 사례+수치\
      \ | 주니어: 학습 의지+기본 이해)\",\n    \"what_to_listen_for\": \"Key phrases or concepts that indicate competence\",\n    \"\
      red_flags\": [\"Warning signs in candidate's answer\"],\n    \"green_flags\": [\"Positive indicators in candidate's\
      \ answer\"],\n    \"time_guidance\": \"How long to spend, when to move on\"\n  }\n}\n```\n\nREMINDER: Return raw JSON\
      \ only. Do NOT use markdown code blocks. Start with { and end with }.\n"
  generate_decision_guide:
    description: 채용 의사결정 가이드 생성
    template: "# CRITICAL OUTPUT RULES (READ FIRST)\n- Return ONLY raw JSON, NO markdown formatting\n- Do NOT wrap output\
      \ in ```json or ``` code blocks\n- Start your response with { and end with }\n- No explanatory text before or after\
      \ the JSON\n\n# ROLE & GOAL\nGenerate a decision guide for the hiring committee based on interview results.\n\n# CONTEXT\n\
      Experience Level: {{experience_level}}\nAnalysis Summary: {{analysis_summary}}\nCategory Summary: {{category_summary}}\n\
      \n# LANGUAGE REQUIREMENT\nWrite ALL output text in {{output_language}}.\nAll descriptions, labels, and guidance must\
      \ be in {{output_language}}.\n\n# OUTPUT FORMAT (JSON)\n```json\n{\n  \"scoring_weights\": {\n    \"role_fit\": 0.20,\n\
      \    \"technical_depth\": 0.30,\n    \"execution_ownership\": 0.25,\n    \"communication\": 0.15,\n    \"risk_flags\"\
      : 0.10\n  },\n  \"decision_thresholds\": {\n    \"strong_hire\": {\"score\": 85, \"description\": \"Exceeds expectations\
      \ in most areas\"},\n    \"hire\": {\"score\": 65, \"description\": \"Meets expectations with growth potential\"},\n\
      \    \"maybe\": {\"score\": 50, \"description\": \"Mixed signals, needs additional evaluation\"},\n    \"no_hire\":\
      \ {\"score\": 35, \"description\": \"Below expectations in critical areas\"}\n  },\n  \"category_insights\": {\n   \
      \ \"role_fit\": \"Key evaluation focus for this category\",\n    \"technical_depth\": \"Key evaluation focus for this\
      \ category\",\n    \"execution_ownership\": \"Key evaluation focus for this category\",\n    \"communication\": \"Key\
      \ evaluation focus for this category\",\n    \"risk_flags\": \"Key evaluation focus for this category\"\n  },\n  \"\
      risk_assessment\": {\n    \"identified_risks\": [\"Risk 1\", \"Risk 2\"],\n    \"mitigation_questions\": [\"Question\
      \ to address Risk 1\", \"Question to address Risk 2\"]\n  },\n  \"experience_level_calibration\": \"Guidance on adjusting\
      \ expectations for {{experience_level}}\"\n}\n```\n\nREMINDER: Return raw JSON only. Do NOT use markdown code blocks.\
      \ Start with { and end with }.\n"
  revise_questions:
    description: 품질 검토 후 질문 수정 - 환각 제거
    template: "# CRITICAL OUTPUT RULES (READ FIRST)\n- Return ONLY raw JSON, NO markdown formatting\n- Do NOT wrap output\
      \ in ```json or ``` code blocks\n- Start your response with [ and end with ]\n- No explanatory text before or after\
      \ the JSON array\n\n# ROLE & GOAL\nRevise interview questions based on quality review feedback, especially to remove\
      \ hallucinations.\n\n# WHAT YOU WILL SEE\n- Original questions with issues flagged\n- Review feedback identifying problems\n\
      - Evidence scores and hallucination risks\n\n# QUESTIONS TO REVISE\n{{questions_json}}\n\n# LANGUAGE REQUIREMENT\nWrite\
      \ ALL output text in {{output_language}}.\nAll revised questions and explanations must be in {{output_language}}.\n\n\
      # REVIEW FEEDBACK\n{{review_feedback}}\n\n# REVISION RULES\n1. **Hallucination detected**: Replace with question based\
      \ on documented evidence only\n2. **Low evidence score**: Make question more open-ended to let candidate demonstrate\n\
      3. **Duplicate detected**: Merge or differentiate questions\n4. **Clarity issue**: Rephrase for better understanding\n\
      5. **Bias detected**: Remove biased language\n\n# OUTPUT FORMAT (JSON)\nReturn revised questions as array:\n```json\n\
      [\n  {\n    \"original_index\": 0,\n    \"revision_type\": \"hallucination_fix|evidence_improvement|clarity_fix|bias_removal|duplicate_merge\"\
      ,\n    \"original_question\": \"Original question text\",\n    \"revised_question\": \"Revised question text\",\n  \
      \  \"revision_rationale\": \"Why this change was made\",\n    \"new_evidence_reference\": \"Updated evidence this is\
      \ based on\",\n    \"new_confidence_score\": 0.0-1.0\n  }\n]\n```\n\n# EXAMPLE REVISION\nOriginal (hallucinated):\n\
      ```json\n{\"question_text\": \"Kubernetes에서 HPA 설정 경험을 말씀해주세요\"}\n```\nReview feedback: \"HALLUCINATION: No Kubernetes\
      \ evidence. Only Docker mentioned.\"\n\nRevised:\n```json\n{\n  \"original_index\": 3,\n  \"revision_type\": \"hallucination_fix\"\
      ,\n  \"original_question\": \"Kubernetes에서 HPA 설정 경험을 말씀해주세요\",\n  \"revised_question\": \"Docker 컨테이너를 사용하면서 스케일링이\
      \ 필요한 상황을 경험하셨나요? 어떻게 처리하셨는지 설명해주세요\",\n  \"revision_rationale\": \"Changed from assumed Kubernetes to documented Docker\
      \ experience\",\n  \"new_evidence_reference\": \"Resume: 'Docker 기반 배포 경험'\",\n  \"new_confidence_score\": 0.85\n}\n\
      ```\n\nREMINDER: Return raw JSON array only. Do NOT use markdown code blocks. Start with [ and end with ].\n"
