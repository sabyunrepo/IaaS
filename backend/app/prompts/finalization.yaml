            "desc": "비개발자용 역량 설명",
            "why": "이 역량이 왜 필요한지",
            "color": "emerald|green|amber|gray|red",
            "icon": "✅|⚠️|❌|❓"
          }
        ],
        "github": {
          "contributions": number,
          "repos": number,
          "main_languages": "주요 언어들",
          "tech_match": "높음|중간|낮음",
          "tech_match_note": "기술 매칭 설명",
          "tenure_pattern": "안정적|보통|잦은이동",
          "tenure_note": "재직 패턴 설명",
          "activity_gap": "공백 기간 설명 또는 null",
          "chart_data": [12개월 기여도 숫자 배열]
