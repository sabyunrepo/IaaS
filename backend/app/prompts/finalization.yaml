  final_synthesis:
    description: "최종 면접 스크립트 종합 - F1 Score 검증 포함"
    template: |
      # CRITICAL OUTPUT RULES (READ FIRST)
      - Return ONLY raw JSON, NO markdown formatting
      - Do NOT wrap output in ```json or ``` code blocks
      - Start your response with { and end with }
      - No explanatory text before or after the JSON

      # ROLE & GOAL
      Final synthesis of all interview components with quality validation.

      # WHAT YOU WILL SEE
      Complete interview package including:
      - Candidate summary
      - All generated questions
      - Evaluation scenarios
      - Interviewer guide

      # F1 SCORE CONCEPT (Evidence Grounding Check)
      Before finalizing, validate that the output is grounded in provided context:

      **Evidence Grounding Score Formula**:
      - Count total claims/questions in output (Total_Output)
      - Count claims/questions with clear source evidence (Grounded_Items)
      - Score = Grounded_Items / Total_Output * 100

      **Threshold**: If score < 70%, flag package for review

      # INPUT DATA
      Candidate Summary: {{candidate_summary}}
      Questions: {{questions_json}}
      Evaluation Scenarios: {{scenarios_json}}
      Interviewer Guide: {{guide_json}}

      # OUTPUT FORMAT (JSON)
      ```json
      {
        "final_validation": {
          "total_questions": number,
          "grounded_questions": number,
          "evidence_grounding_score": 0-100,
          "passed_threshold": true|false,
          "flagged_items": [
            {
              "item_type": "question|claim|scenario",
              "item_index": number,
              "issue": "description of grounding issue",
              "recommendation": "how to fix"
            }
          ]
        },
        "package_quality": {
          "overall_score": 0-100,
          "category_coverage": {"category": "complete|partial|missing"},
          "difficulty_balance": "balanced|skewed_easy|skewed_hard",
          "evidence_quality": "strong|moderate|weak"
        },
        "ready_for_delivery": true|false,
        "delivery_blockers": ["list of issues preventing delivery"],
        "improvement_suggestions": ["optional improvements"]
      }
      ```

      # VALIDATION RULES
      - If evidence_grounding_score < 70: ready_for_delivery = false
      - If any category has 0 questions: ready_for_delivery = false
      - If >20% of questions flagged: ready_for_delivery = false

      REMINDER: Return raw JSON only. Do NOT use markdown code blocks. Start with { and end with }.

  generate_intel_brief:
    description: "v2 Intel Brief 생성 - JD 분석 + 역량 매칭 + GitHub/LinkedIn 요약"
    template: |
      # CRITICAL OUTPUT RULES (READ FIRST)
      - Return ONLY raw JSON, NO markdown formatting
      - Do NOT wrap output in ```json or ``` code blocks
      - Start your response with { and end with }
      - No explanatory text before or after the JSON

      # LANGUAGE REQUIREMENT
      Write ALL output text in {{output_language}}.
      All labels, descriptions, and free-text fields must be in {{output_language}}.

      # ROLE & GOAL
      Generate an Intel Brief for non-technical interviewers. This provides a clear overview
      of the candidate's fit with the JD requirements, GitHub activity, and LinkedIn history.

      # INPUTS
      JD Analysis: {{jd_analysis}}
      Document Analysis: {{document_analysis}}
      GitHub Analysis: {{github_analysis}}
      LinkedIn Profile: {{linkedin_profile}}

      # ANTI-HALLUCINATION RULES (CRITICAL)
      1. ONLY use information explicitly present in the inputs
      2. For competency matching, match_label MUST reflect actual evidence:
         - "strong" = Evidence in 2+ sources with concrete examples
         - "match" = Evidence in 1 source with specific details
         - "partial" = Mentioned but not demonstrated
         - "unknown" = No evidence either way
         - "none" = Evidence suggests lack of skill
      3. GitHub chart_data MUST come from actual github_analysis, NOT fabricated
      4. LinkedIn positions MUST match linkedin_profile exactly

      # OUTPUT FORMAT (v2 IntelBrief)
      ```json
      {
        "jd_summary": {
          "title": "직책명",
          "subtitle": "회사/부서",
          "requirements": [
            {
              "text": "요구사항 (JD 원문)",
