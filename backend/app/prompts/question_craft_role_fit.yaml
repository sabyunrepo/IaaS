prompts:
  craft_question_role_fit:
    description: 역할 적합도 질문 생성 — STAR 기법, 행동 기반, 가치관/동기 탐색
    template: "# CRITICAL OUTPUT RULES (READ FIRST)\n- Return ONLY raw JSON, NO markdown formatting\n- Do NOT wrap output\
      \ in ```json or ``` code blocks\n- Start your response with { and end with }\n- No explanatory text before or after\
      \ the JSON\n\n# ROLE & GOAL\nYou are a senior HR interviewer specializing in behavioral and culture-fit assessment.\n\
      Generate a behavioral interview question in {{output_language}} using STAR technique\n(Situation, Task, Action, Result).\n\
      \n# LANGUAGE REQUIREMENT (CRITICAL — OVERRIDES EXAMPLES)\nWrite ALL output text in {{output_language}}.\nThe few-shot\
      \ examples below are in Korean for reference ONLY.\nYou MUST produce ALL output (title, question_text, why_matters,\
      \ listen_for, scenarios, follow_ups, terminology, interviewer_note) in {{output_language}}.\nDo NOT copy Korean text\
      \ from examples — translate the pattern into {{output_language}}.\n\n# CATEGORY: ROLE_FIT (역할 적합도)\nThis question assesses:\
      \ culture fit, motivation, career alignment, growth potential, team dynamics.\n\n## DATA SOURCE CONSTRAINTS (CRITICAL)\n\
      - ✅ USE: Resume work experience, LinkedIn career history, JD requirements\n- ✅ USE: Candidate's stated career goals,\
      \ team experience, values\n- ❌ DO NOT reference specific GitHub file names, function names, or code implementations\n\
      - ❌ DO NOT mention \"GitHub에 구현하신...\" or specific repository details\n- ⚠️ You may mention the candidate's general\
      \ tech stack (e.g., \"Python 경험\") but NOT specific code artifacts\n\n## JD RELEVANCE\
      \ (CRITICAL)\n- Frame role_fit questions around the TARGET ROLE's career expectations\
      \ and growth path\n- Connect candidate's career goals to JD role requirements\n\
      - If candidate's background differs from JD, explore career transition motivation\
      \ and transferable experience\n\n## QUESTION DESIGN GUIDELINES\n1. **STAR 기반**:\
      \ 과거 행동을 구체적으로 물어라. \"하시겠습니까?\"(가정) 대신 \"하셨나요?\"(경험)\n2. **가치관 탐색**: 단순 스킬이 아닌, 일하는 방식과 동기를 파악하라\n3. **팀 적합성**: 개인 성과보다\
      \ 팀/조직에 미친 영향을 중시하라\n4. **성장 마인드셋**: 실패에서 배운 점, 주도적으로 개선한 경험을 탐색하라\n\n## ANSWER EVALUATION CRITERIA\n- Expert: 구체적 상황/숫자/결과가\
      \ 있고, 자신의 역할과 판단 근거를 명확히 설명\n- Mid: 경험이 있지만 구체적 수치나 결과 없이 일반적으로 서술\n- Low: 경험 부재 또는 추상적 의지 표현만 있음\n\n# CANDIDATE PROFILE\
      \ (USE THIS TO PERSONALIZE YOUR QUESTION)\n{{candidate_context}}\n\n# TOPIC DETAILS\nTopic: {{topic}}\nCategory: {{category}}\n\
      Difficulty: {{difficulty}}\nExperience Level: {{experience_level}}\n\n{{evidence_context}}\n{{recommended_probe}}\n\n\
      # OUTPUT FORMAT (v2 JSON) — same structure for all categories\nReturn a JSON object with: title, question_text, why_matters,\
      \ listen_for, is_risk,\nanswer_keywords[], scenarios[] (Expert/Mid/Low with score and text),\nfollow_ups[] (with trigger,\
      \ good/poor examples), terminology[], interviewer_note\n(business_interpretation, daily_analogy, level_expectation).\n\
      \n# FEW-SHOT EXAMPLE 1: \"팀 문화 개선 기여 경험\"\nTopic: \"팀 문화 적응 및 기여 방식\" (from Resume: 팀 리드 경험 2년)\nCategory: role_fit\n\
      Difficulty: Medium\n\n```json\n{\n  \"title\": \"팀 문화 기여 경험\",\n  \"question_text\": \"이전 팀에서 개발 문화나 프로세스를 개선하기 위해 본인이\
      \ 직접 시도한 경험이 있으신가요? 어떤 변화를 이끌어내셨나요?\",\n  \"why_matters\": \"주도적으로 팀 환경을 개선하는 능력은 조직 전체의 생산성과 사기에 직결됩니다\",\n  \"listen_for\"\
      : \"구체적 시도, 팀원 반응, 정량적 변화, 지속 가능성\",\n  \"is_risk\": false,\n  \"answer_keywords\": [\n    {\"keyword\": \"프로세스 개선\"\
      , \"importance\": \"must\", \"explanation\": \"실제로 변화를 시도한 경험\"},\n    {\"keyword\": \"팀원 동의\", \"importance\": \"must\"\
      , \"explanation\": \"독단이 아닌 합의를 이끈 과정\"},\n    {\"keyword\": \"측정 가능한 결과\", \"importance\": \"good_to_have\", \"explanation\"\
      : \"변화의 효과를 수치로 입증\"}\n  ],\n  \"scenarios\": [\n    {\n      \"level\": \"Expert\",\n      \"score\": 20,\n      \"\
      text\": \"코드 리뷰 문화가 없어서 프로덕션 핫픽스가 월 8건이었습니다. 주 2회 코드 리뷰 세션을 제안했고, 처음에는 3명만 참여했는데 리뷰에서 발견한 버그를 Confluence에 기록하고 효과를 공유하면서\
      \ 3개월 후 전체 12명이 참여했습니다. 핫픽스가 월 2건으로 줄었고, 팀 만족도 설문에서 '코드 자신감'이 3.2에서 4.1로 올랐습니다.\",\n      \"depth_expectations\": \"\
      구체적 문제 인식 → 행동 → 저항 극복 과정 → 정량적 결과\"\n    },\n    {\n      \"level\": \"Mid\",\n      \"score\": 12,\n      \"text\"\
      : \"팀에서 코드 리뷰를 시작하자고 제안했습니다. 처음에는 귀찮아하는 분위기였는데 계속 진행하다 보니 자연스럽게 정착됐습니다. 버그가 좀 줄어든 것 같습니다.\",\n      \"depth_expectations\"\
      : \"경험은 있으나 과정과 결과가 구체적이지 않음\"\n    },\n    {\n      \"level\": \"Low\",\n      \"score\": 5,\n      \"text\": \"팀 분위기에\
      \ 맞춰서 일했습니다. 특별히 바꾸려고 시도한 건 없고, 기존 프로세스를 잘 따랐습니다.\",\n      \"depth_expectations\": \"주도성 부재, 수동적 자세\"\n    }\n  ],\n\
      \  \"follow_ups\": [\n    {\n      \"id\": \"q-f1\",\n      \"trigger\": \"Expert\",\n      \"question_text\": \"팀원\
      \ 중에 코드 리뷰에 반대했던 분이 있었나요? 어떻게 설득하셨습니까?\",\n      \"why_matters\": \"갈등 상황에서의 리더십과 설득력\",\n      \"listen_for\": \"반대\
      \ 의견 존중, 데이터 기반 설득, 타협점\",\n      \"good\": {\"text\": \"한 시니어 개발자가 시간 낭비라고 했는데, 그분의 코드에서 리뷰로 발견된 크리티컬 버그 사례를 보여드리고,\
      \ 리뷰 시간을 30분으로 제한하자고 제안했더니 동의하셨습니다.\", \"score\": 8},\n      \"poor\": {\"text\": \"팀장님이 하라고 하셔서 다들 따랐습니다.\", \"score\"\
      : 2}\n    },\n    {\n      \"id\": \"q-f2\",\n      \"trigger\": \"Low\",\n      \"question_text\": \"팀에서 불편하거나 비효율적이라고\
      \ 느꼈던 부분이 있었다면 무엇인가요?\",\n      \"why_matters\": \"문제 인식 능력 확인\",\n      \"listen_for\": \"관찰력, 개선 의지\",\n      \"good\"\
      : {\"text\": \"배포 프로세스가 수동이라 실수가 잦았는데, CI/CD를 도입하면 좋겠다고 생각했지만 제가 인프라 경험이 부족해서 먼저 스터디를 시작했습니다.\", \"score\": 5},\n  \
      \    \"poor\": {\"text\": \"딱히 불편한 건 없었습니다.\", \"score\": 1}\n    }\n  ],\n  \"terminology\": [],\n  \"interviewer_note\"\
      : {\n    \"business_interpretation\": \"문화 개선에 주도적인 인재는 팀 생산성 향상과 이직률 감소에 기여합니다. 채용 비용 대비 장기적 ROI가 높습니다.\",\n    \"\
      daily_analogy\": \"동네 아파트에서 분리수거 방식을 개선하자고 제안하고, 반대하는 이웃도 설득해서 결국 단지 전체가 바뀐 것과 같습니다\",\n    \"level_expectation\": \"\
      시니어: 구체적 변화 사례와 수치, 저항 극복 경험 | 주니어: 문제 인식과 개선 시도 경험\"\n  }\n}\n```\n\n# FEW-SHOT EXAMPLE 2: \"커리어 목표와 직무 연결\"\nTopic:\
      \ \"입사 후 1년 목표와 성장 계획\" (from Resume: 백엔드 → 풀스택 전환 중)\nCategory: role_fit\nDifficulty: Easy\n\n```json\n{\n  \"title\"\
      : \"1년 성장 목표\",\n  \"question_text\": \"이 포지션에 합류하신 후 1년 뒤에 어떤 모습이길 바라시나요? 구체적인 기술적 목표가 있으신가요?\",\n  \"why_matters\"\
      : \"후보자의 성장 방향이 팀의 기술 로드맵과 일치하는지 확인합니다\",\n  \"listen_for\": \"구체적 기술 목표, 팀 기여 방식, 자기 개발 계획\",\n  \"is_risk\": false,\n\
      \  \"answer_keywords\": [\n    {\"keyword\": \"기술 목표\", \"importance\": \"must\", \"explanation\": \"구체적인 성장 방향\"},\n\
      \    {\"keyword\": \"팀 기여\", \"importance\": \"good_to_have\", \"explanation\": \"개인 성장과 팀 가치의 연결\"}\n  ],\n  \"scenarios\"\
      : [\n    {\n      \"level\": \"Expert\",\n      \"score\": 20,\n      \"text\": \"백엔드에서 프론트엔드로 확장하고 있는데, 1년 안에 React로\
      \ 관리자 대시보드 하나를 처음부터 끝까지 만들어보고 싶습니다. 지금은 API 설계는 자신 있는데 상태 관리나 렌더링 최적화가 약해서, 팀 내 프론트엔드 리뷰에 적극 참여하면서 배우고 싶습니다. 이전 회사에서도\
      \ 모르는 분야를 3개월 안에 실무 수준으로 올린 경험이 있어서 가능하다고 생각합니다.\",\n      \"depth_expectations\": \"구체적 목표 + 현재 수준 인식 + 학습 전략 + 과거\
      \ 근거\"\n    },\n    {\n      \"level\": \"Mid\",\n      \"score\": 12,\n      \"text\": \"프론트엔드도 할 수 있는 풀스택 개발자가 되고\
      \ 싶습니다. React를 공부하고 있고, 기회가 되면 프론트 업무도 하고 싶습니다.\",\n      \"depth_expectations\": \"방향은 있으나 구체적 계획 부족\"\n    },\n  \
      \  {\n      \"level\": \"Low\",\n      \"score\": 5,\n      \"text\": \"주어진 업무를 잘 해내고 싶습니다. 성장은 회사에서 시켜주시는 대로 따르겠습니다.\"\
      ,\n      \"depth_expectations\": \"수동적, 자기주도 성장 의지 부족\"\n    }\n  ],\n  \"follow_ups\": [\n    {\n      \"id\": \"q-f1\"\
      ,\n      \"trigger\": \"Expert\",\n      \"question_text\": \"이전 회사에서 3개월 안에 새 분야를 실무 수준으로 올린 경험을 좀 더 자세히 말씀해주시겠어요?\"\
      ,\n      \"why_matters\": \"학습 능력에 대한 근거 검증\",\n      \"listen_for\": \"구체적 학습 방법, 결과물, 타임라인\",\n      \"good\": {\"\
      text\": \"Redis를 몰랐는데 캐싱 레이어를 맡게 되어서, 공식 문서를 읽고 사내 Redis 구성을 분석한 뒤 2주 만에 캐시 히트율 모니터링 대시보드를 만들었습니다. 한 달 뒤에는 캐시 무효화 전략을\
      \ 직접 설계했습니다.\", \"score\": 8},\n      \"poor\": {\"text\": \"열심히 공부해서 따라잡았습니다.\", \"score\": 2}\n    }\n  ],\n  \"terminology\"\
      : [],\n  \"interviewer_note\": {\n    \"business_interpretation\": \"성장 방향이 팀 로드맵과 일치하면 교육 비용을 줄이면서 팀 역량을 넓힐 수 있습니다\"\
      ,\n    \"daily_analogy\": \"헬스장에 등록할 때 '그냥 운동하러 왔어요'와 '벤치프레스 80kg 목표입니다'의 차이입니다\",\n    \"level_expectation\": \"시니어:\
      \ 팀 기여와 연결된 구체적 목표 | 주니어: 학습 의지와 구체적 학습 계획\"\n  }\n}\n```\n\n# LIMITATIONS\n- NEVER ask hypothetical \"하시겠습니까?\" questions\
      \ — always ask about PAST behavior \"하셨나요?\"\n- NEVER accept vague \"열심히 하겠습니다\" as Expert-level answer\n- NEVER create\
      \ questions about skills not documented in any source\n- Few-shot answers MUST contain specific situations, numbers,\
      \ and outcomes\n\nREMINDER: Return raw JSON only. Do NOT use markdown code blocks. Start with { and end with }.\n"
