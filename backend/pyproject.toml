[project]
name = "vantict-sniper"
version = "4.0.0"
description = "AI Technical Interview Script Generator"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    # Cache
    "redis>=5.0.0",
    # Settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Auth
    "httpx-oauth>=0.13.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.0",
    # Temporal
    "temporalio>=1.6.0",
    # LLM
    "pydantic-ai>=0.0.36",
    "pydantic-ai-litellm>=0.2.3",  # LiteLLM bridge for pydantic-ai (Z.AI, Cohere, etc.)
    "litellm>=1.40.0",
    "instructor>=1.3.0",
    # Document Parsing
    "docling>=2.0.0",
    "pymupdf4llm>=0.0.10",
    # Code Analysis
    "PyGithub>=2.3.0",
    "pydriller>=2.6",
    "tree-sitter>=0.22.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    # Storage
    "boto3>=1.34.0",
    "obstore>=0.1.0",
    # Observability
    "langfuse>=2.36.0",
    "arize-phoenix[evals]>=8.0.0",
    # Templates
    "jinja2>=3.1.0",
    # HTTP
    "httpx>=0.27.0",
    # Utilities
    "python-dateutil>=2.9.0",
    # Knowledge Graph
    "spacy>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
