services:
  # --- Data Layer ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jittda_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jittda}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
    networks:
      - internal_net

  redis:
    image: redis:7-alpine
    container_name: jittda_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  sonarqube:
    image: sonarqube:community
    container_name: jittda_sonarqube
    profiles: ["analysis"]
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgres:5432/sonarqube
      - SONAR_JDBC_USERNAME=${POSTGRES_USER:-postgres}
      - SONAR_JDBC_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9000:9000"
    networks:
      - internal_net

  # --- Application Layer ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jittda_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-jittda}
      - REDIS_URL=redis://redis:6379
      - LANGGRAPH_CHECKPOINTER_URI=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-jittda}
      - SONAR_ON_DEMAND=true
      # LLM
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.moonshot.cn/v1}
      # Embeddings
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      # Langfuse
      - LANGFUSE_HOST=${LANGFUSE_HOST:-}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      # GitHub
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # LinkedIn (BrightData)
      - BRIGHTDATA_API_KEY=${BRIGHTDATA_API_KEY:-}
      - BRIGHTDATA_SCRAPING_BROWSER_URL=${BRIGHTDATA_SCRAPING_BROWSER_URL:-}
      # Auth
      - JWT_SECRET=${JWT_SECRET:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3001}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    ports:
      - "8001:8000"
    networks:
      - internal_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP: admin-app
    container_name: jittda_frontend
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "3001:80"
    networks:
      - internal_net

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    container_name: jittda_sonar_scanner
    profiles: ["analysis"]
    depends_on:
      - sonarqube
    networks:
      - internal_net

volumes:
  postgres_data:
  redis_data:
  sonarqube_data:
  sonarqube_extensions:

networks:
  internal_net:
    driver: bridge
