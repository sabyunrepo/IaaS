services:
  # --- Data Layer ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jittda_postgres
    environment:
      POSTGRES_DB: jittda
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
    networks:
      - internal_net

  redis:
    image: redis:7-alpine
    container_name: jittda_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  sonarqube:
    image: sonarqube:community
    container_name: jittda_sonarqube
    profiles: ["analysis"]
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgres:5432/sonarqube
      - SONAR_JDBC_USERNAME=postgres
      - SONAR_JDBC_PASSWORD=postgres
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9000:9000"
    networks:
      - internal_net

  # --- Application Layer ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jittda_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/jittda
      - REDIS_URL=redis://redis:6379
      - LANGGRAPH_CHECKPOINTER_URI=postgresql://postgres:postgres@postgres:5432/jittda
      - SONAR_ON_DEMAND=true
      - LANGFUSE_HOST=${LANGFUSE_HOST:-}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - KIMI_API_KEY=${KIMI_API_KEY:-}
    volumes:
      - ./backend/src:/app/src
    ports:
      - "8001:8000"
    networks:
      - internal_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP: admin-app
    container_name: jittda_frontend
    depends_on:
      - backend
    ports:
      - "3001:80"
    networks:
      - internal_net

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    container_name: jittda_sonar_scanner
    profiles: ["analysis"]
    depends_on:
      - sonarqube
    networks:
      - internal_net

volumes:
  postgres_data:
  redis_data:
  sonarqube_data:
  sonarqube_extensions:

networks:
  internal_net:
    driver: bridge
