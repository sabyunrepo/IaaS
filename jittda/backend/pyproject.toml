[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jittda-backend"
version = "5.0.0"
description = "Jittda Sniper v5.0 - AI Interview Script Generator Backend"
requires-python = ">=3.11"
dependencies = [
    # Orchestration: LangGraph 1.0 GA + PostgreSQL Checkpointer
    "langgraph>=1.0.8",
    "langgraph-checkpoint-postgres>=3.0.4",

    # LLM: Structured Output + Prompt Management
    "instructor>=1.7.0",
    "langfuse>=2.57.0",

    # Web Framework
    "fastapi>=0.119.0",
    "uvicorn>=0.30.0",
    "websockets>=14.0",

    # AST & Static Analysis (native bindings) — ADR-0006: 0.25.x QueryCursor API
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.23.6",
    "tree-sitter-javascript>=0.23.1",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-go>=0.23.4",
    "radon>=6.0.1",
    "lizard>=1.17.10",
    "bandit>=1.8.0",

    # Git & GitHub
    "PyGithub>=2.5.0",
    "gql[aiohttp]>=3.5.0",
    "PyDriller>=2.9",

    # Data & Vector
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.6",
    "redis>=5.2.0",
    "datasketch>=1.6.5",

    # Utilities
    "pydantic>=2.12.5",
    "python-Levenshtein>=0.26.0",
    "httpx>=0.28.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "authlib>=1.3.0",

    # Logging
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-benchmark>=5.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "benchmark: performance benchmark tests (deselect with '-m \"not benchmark\"')",
]

[tool.pytest-asyncio]
asyncio_mode = "auto"
