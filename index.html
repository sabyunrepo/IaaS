<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verdict - AI 기술 면접 스크립트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .nav-item { transition: all 0.2s; border-left: 3px solid transparent; }
        .nav-item:hover { background-color: #f1f5f9; }
        .nav-item.active { background-color: #e0f2fe; border-left-color: #0284c7; }
        .tab-btn { position: relative; transition: color 0.2s; }
        .tab-btn::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 2px; background: #0284c7; transition: width 0.3s; }
        .tab-btn.active { color: #0284c7; font-weight: 700; }
        .tab-btn.active::after { width: 100%; }
        .scenario-card { transition: all 0.2s; border: 2px solid #e2e8f0; cursor: pointer; }
        .scenario-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .selected-expert { border-color: #10b981; background-color: #ecfdf5; }
        .selected-mid { border-color: #f59e0b; background-color: #fffbeb; }
        .selected-low { border-color: #ef4444; background-color: #fef2f2; }
        .fu-card { transition: all 0.3s; }
        .fu-card.dimmed { opacity: 0.35; }
        .fu-card.highlighted { border-left: 3px solid; }
        .fu-good { border-color: #10b981; background-color: #f0fdf4; cursor: pointer; }
        .fu-poor { border-color: #ef4444; background-color: #fef2f2; cursor: pointer; }
        .fu-good.active { ring: 2px solid #10b981; box-shadow: 0 0 0 2px #10b981; }
        .fu-poor.active { ring: 2px solid #ef4444; box-shadow: 0 0 0 2px #ef4444; }
        .collapsible-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .collapsible-content.open { max-height: 5000px; }
        .section-nav-item { transition: all 0.2s; }
        .section-nav-item:hover { color: #0284c7; }
        .section-nav-item.active-section { color: #0284c7; font-weight: 700; border-right: 2px solid #0284c7; }
        .kw-badge { transition: all 0.2s; cursor: pointer; user-select: none; }
        .kw-badge.checked { opacity: 1; ring: 2px; }
        .kw-badge.unchecked { opacity: 0.6; }
        .stepper-item { position: relative; }
        .stepper-item::after { content:''; position:absolute; top:50%; right:-1rem; width:2rem; height:2px; background:#cbd5e1; }
        .stepper-item:last-child::after { display:none; }
        .stepper-item.active-step { background-color:#e0f2fe; border-color:#0284c7; color:#0284c7; }
        .stepper-item.done-step { background-color:#ecfdf5; border-color:#10b981; color:#10b981; }
        .section-side-nav { position:sticky; top:1rem; }
        .section-side-link { transition: all 0.2s; border-left: 2px solid transparent; }
        .section-side-link:hover { border-left-color: #94a3b8; }
        .section-side-link.active-nav { border-left-color: #0284c7; color: #0284c7; font-weight: 700; }
    </style>
</head>
<body class="text-slate-800 h-screen flex overflow-hidden">

    <!-- LEFT SIDEBAR -->
    <aside class="w-72 bg-white border-r border-slate-200 flex flex-col z-20 shadow-sm">
        <div class="p-6 border-b border-slate-100 flex items-center gap-3">
            <div class="w-8 h-8 bg-slate-900 text-white rounded-lg flex items-center justify-center font-black text-xl">V</div>
            <div>
                <span class="font-bold text-xl text-slate-900 tracking-tight">Verdict</span>
                <div class="text-[10px] text-slate-400 font-medium">Sniper v4.0</div>
            </div>
        </div>
        <div class="flex-1 overflow-y-auto py-4" id="sidebar-candidates"></div>
        <div class="p-4 border-t border-slate-100 bg-slate-50">
            <button class="w-full py-2 bg-white border border-slate-300 rounded-lg text-sm font-bold text-slate-600 hover:bg-slate-100 shadow-sm transition">+ New Interview</button>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 flex flex-col min-w-0 bg-slate-50 relative">
        <header class="bg-white border-b border-slate-200 px-8 py-5 flex justify-between items-center shadow-sm z-10">
            <div>
                <h1 class="text-2xl font-bold text-slate-900" id="header-name">Alex Chen</h1>
                <div class="flex items-center gap-2 text-sm text-slate-500 mt-1">
                    <span id="header-role">CTO Candidate</span><span>•</span>
                    <span class="px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 text-xs font-bold" id="header-context">Series A FinTech</span>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <div class="text-right">
                    <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Total Score</div>
                    <div class="text-3xl font-bold text-blue-600 leading-none" id="total-score">0 <span class="text-sm text-slate-300 font-normal">/ —</span></div>
                    <div class="text-[10px] text-slate-400 mt-0.5">+ 보너스 <span id="bonus-score" class="font-bold text-emerald-500">0</span></div>
                </div>
                <div class="h-10 w-px bg-slate-200"></div>
                <button class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-2.5 rounded-lg font-bold shadow-lg transition flex items-center gap-2 text-sm">Export PDF</button>
            </div>
        </header>

        <div class="bg-white border-b border-slate-200 px-8 sticky top-0 z-10">
            <nav class="flex space-x-8" id="main-tabs"></nav>
        </div>

        <div class="flex-1 overflow-y-auto p-8 scroll-smooth" id="content-area">

            <!-- TAB 1: INTEL BRIEF (dynamically rendered) -->
            <div id="view-intel" class="space-y-8 fade-in hidden"></div>

            <!-- TAB 2: DEEP ANALYSIS (dynamically rendered) -->
            <div id="view-analysis" class="space-y-8 fade-in hidden"></div>

            <!-- TAB 3: LIVE INTERVIEW -->
            <div id="view-interview" class="fade-in hidden">
                <!-- Phase 1: Question Selection -->
                <div id="question-select-phase"></div>
                <!-- Phase 2: Interview -->
                <div id="question-interview-phase" style="display:none">
                    <div class="flex items-center justify-between mb-4">
                        <div class="bg-indigo-50 border-l-4 border-indigo-500 p-4 rounded-r-lg flex-1">
                            <h3 class="text-sm font-bold text-indigo-900 uppercase">비개발자 면접관을 위한 안내</h3>
                            <p class="text-sm text-indigo-800 mt-1">개발 용어를 모르셔도 됩니다. 각 질문의 <strong>"이 질문이 중요한 이유"</strong>와 <strong>"이런 답변을 들어보세요"</strong>를 참고하세요. 질문을 그대로 읽어주시면 됩니다. 답변 후 해당하는 수준을 클릭하면 <strong>맞춤 꼬리질문</strong>이 자동으로 표시됩니다.</p>
                        </div>
                        <button onclick="backToSelect()" class="ml-4 px-4 py-2 bg-white border border-slate-300 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition shrink-0">← 질문 다시 선택</button>
                    </div>
                    <!-- Progress Bar -->
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-4">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-sm font-bold text-slate-700" id="progress-label">0 / 25 질문 채점 완료</span>
                            <span class="text-xs text-slate-400" id="progress-time">예상 잔여: ~125분</span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-2.5"><div class="bg-blue-500 h-2.5 rounded-full transition-all" id="progress-bar" style="width:0%"></div></div>
                    </div>
                    <!-- Category Stepper -->
                    <div class="flex items-center justify-center gap-4 mb-6 flex-wrap" id="category-stepper">
                    </div>
                    <!-- Main Layout: Questions + Side Nav -->
                    <div class="flex gap-6">
                        <div class="flex-1 min-w-0" id="questions-container"></div>
                        <!-- Right Side Navigation -->
                        <div class="hidden lg:block w-48 shrink-0">
                            <div class="section-side-nav space-y-1" id="section-side-nav"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TAB 4: DECISION (dynamically rendered) -->
            <div id="view-decision" class="space-y-6 fade-in hidden"></div>
        </div>
    </main>

<script src="scenario-alex.js"></script>
<script src="scenario-sarah.js"></script>
<script src="scenario-james.js"></script>
<script src="app.js"></script>
</body>
</html>
