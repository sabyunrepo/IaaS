services:
  # ============================================
  # Frontend (Nginx + React)
  # ============================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iaas-frontend
    restart: unless-stopped
    environment:
      - VITE_BACKEND_URL=${FRONTEND_BACKEND_URL:-http://localhost:8000}
    depends_on:
      - backend
    networks:
      - iaas_internal
      - cloudflare_tunnel  # Cloudflare 터널에서 접근 가능
    ports:
      - "80:80"

  # ============================================
  # Core Services (내부망만 연결)
  # ============================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: iaas-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENV=local
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/vantict
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      - TEMPORAL_HOST=temporal:7233
      - STORAGE_BACKEND=local
      - LOCAL_STORAGE_PATH=/app/data
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-placeholder}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-openai:gpt-4o}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-anthropic:claude-3-5-sonnet-20241022}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - BRIGHTDATA_API_TOKEN=${BRIGHTDATA_API_TOKEN:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - OAUTH_TOKEN_ENCRYPTION_KEY=${OAUTH_TOKEN_ENCRYPTION_KEY:-dev-key-generate-with-fernet}
      - SESSION_SECRET=${SESSION_SECRET:-dev-session-secret}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-dev-internal-token}
      - LLM_CACHE_ENABLED=${LLM_CACHE_ENABLED:-true}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      temporal:
        condition: service_started
      phoenix:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - iaas_internal
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: iaas-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENV=local
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/vantict
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      - TEMPORAL_HOST=temporal:7233
      - STORAGE_BACKEND=local
      - LOCAL_STORAGE_PATH=/app/data
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-placeholder}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-openai:gpt-4o}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-anthropic:claude-3-5-sonnet-20241022}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - BRIGHTDATA_API_TOKEN=${BRIGHTDATA_API_TOKEN:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - INTERNAL_API_URL=http://backend:8000
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-dev-internal-token}
      - LLM_CACHE_ENABLED=${LLM_CACHE_ENABLED:-true}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      - backend
      - temporal
      - phoenix
    command: python -m app.worker
    networks:
      - iaas_internal
    profiles:
      - worker  # worker는 명시적으로 활성화

  # ============================================
  # Database (내부망만)
  # ============================================

  postgres:
    image: pgvector/pgvector:pg16
    container_name: iaas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vantict}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - iaas_internal
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: iaas-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-redis_dev_password}
    networks:
      - iaas_internal
    ports:
      - "6379:6379"

  # ============================================
  # Temporal (Workflow Engine, 내부망만)
  # ============================================

  temporal:
    image: temporalio/auto-setup:1.22
    container_name: iaas-temporal
    restart: unless-stopped
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/development.yaml
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config/temporal:/etc/temporal/config/dynamicconfig
    networks:
      - iaas_internal
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.21.3
    container_name: iaas-temporal-ui
    restart: unless-stopped
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:5173
    depends_on:
      - temporal
    networks:
      - iaas_internal
    ports:
      - "8080:8080"

  # ============================================
  # LLM Observability
  # ============================================
  # Langfuse는 외부 서버 사용: https://langfuse.mystery-place.com

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: iaas-phoenix
    restart: unless-stopped
    environment:
      - PHOENIX_WORKING_DIR=/data
      - PHOENIX_ENABLE_AUTH=false
    volumes:
      - phoenix_data:/data
    networks:
      - iaas_internal
    ports:
      - "6006:6006"    # UI + HTTP
      - "4317:4317"    # gRPC (OpenTelemetry)

  # ============================================
  # AWS Local Emulation (내부망만)
  # ============================================

  localstack:
    image: localstack/localstack:3.0
    container_name: iaas-localstack
    environment:
      - SERVICES=s3
      - DEBUG=0
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh
    networks:
      - iaas_internal
    profiles:
      - storage  # S3 사용 시에만 활성화

# ============================================
# Networks
# ============================================

networks:
  iaas_internal:
    name: iaas_internal
    driver: bridge

  cloudflare_tunnel:
    name: cloudflare_tunnel
    external: true
    # docker-compose.tunnel.yml에서 생성된 네트워크 사용

# ============================================
# Volumes
# ============================================

volumes:
  postgres_data:
  redis_data:
  localstack_data:
  backend_venv:
  phoenix_data:
