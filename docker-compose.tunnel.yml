# Cloudflare Tunnel을 통한 호스팅 설정
# 사용법: docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d

services:
  # ============================================
  # Nginx Reverse Proxy (Cloudflare Tunnel 진입점)
  # ============================================

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"

  # ============================================
  # Cloudflare Tunnel
  # ============================================

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - default

  # ============================================
  # Frontend (Production Build)
  # ============================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_BACKEND_URL=https://test.mystery-place.com
    depends_on:
      - backend

  # ============================================
  # Override Backend URLs for Production
  # ============================================

  backend:
    environment:
      - FRONTEND_URL=https://test.mystery-place.com
      - BACKEND_URL=https://test.mystery-place.com
      - BRIGHTDATA_API_TOKEN=${BRIGHTDATA_API_TOKEN}

  worker:
    environment:
      - BRIGHTDATA_API_TOKEN=${BRIGHTDATA_API_TOKEN}
