name: E2E Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # Weekly Monday 3 AM UTC

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jittda/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: jittda/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright tests
        run: pnpm --filter @jittda/admin-app test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: jittda/frontend/packages/admin-app/playwright-report/
          retention-days: 7
